<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Microblogger Management System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
<style>
:root{--gold:#C2941B;--gold-d:#A67C12;--gold-dd:#8C690F;--gold-bg:#FBF5E6;--bg:#f8f7f4;--ink:#1f2328;--ink2:#4b5158;--mute:#80868d;--line:#e6e6e1;--line2:#efefea;--soft:#f2f2ee;
--green:#2f7d4f;--green-bg:#e8f3ec;--amber:#946512;--amber-bg:#fbf1dc;--red:#b4402f;--red-bg:#fbe9e5;--blue:#2d5f8a;--blue-bg:#e7eff6;--grey:#62676d;--grey-bg:#efefeb}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Inter,system-ui,-apple-system,sans-serif;color:var(--ink);background:var(--bg);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;color:inherit}
input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
.ic{flex:none;display:block}
h1,h2,h3,h4{margin:0;font-weight:600}

/* demo bar */
#demobar{position:sticky;top:0;z-index:60;height:46px;display:flex;align-items:center;gap:14px;padding:0 16px;background:#1f2328;color:#d9dad5;font-size:12.5px}
.demo-tag{background:var(--gold);color:#fff!important;color:#1f2328;font-weight:600;padding:2px 9px;border-radius:99px;font-size:11px;letter-spacing:.02em;white-space:nowrap}
.seg{display:flex;background:#30353c;border-radius:8px;padding:3px;gap:2px}
.seg button{background:none;border:0;color:#c3c5c0;padding:5px 12px;border-radius:6px;font-size:12.5px;white-space:nowrap}
.seg button.on{background:#fff;color:#1f2328;font-weight:500}
@media (max-width:560px){#demobar{gap:8px;padding:0 8px}.demo-tag{display:none}.seg{min-width:0;max-width:100%;overflow-x:auto}.seg button{padding:5px 7px;font-size:12px}}
.demobar-note{margin-left:auto;color:#9fa29c;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* admin layout */
.admin{display:grid;grid-template-columns:236px 1fr;min-height:calc(100vh - 46px)}
.admin.collapsed{grid-template-columns:68px 1fr}
.side{background:#fff;border-right:1px solid var(--line);padding:16px 12px;display:flex;flex-direction:column;gap:2px;position:sticky;top:46px;height:calc(100vh - 46px)}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px}
.brand-logo{display:block;height:auto}
.brand-mark{width:30px;height:30px;border-radius:8px;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.brand-t{font-weight:600;font-size:13.5px;line-height:1.2}.brand-s{font-size:11.5px;color:var(--mute)}
.nav{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:8px;color:var(--ink2);border:0;background:none;width:100%;text-align:left;font-size:13.5px}
.nav:hover{background:var(--soft)}
.nav.on{background:var(--gold-bg);color:var(--ink);font-weight:600;box-shadow:inset 3px 0 0 var(--gold)}
.nav .cnt{margin-left:auto;font-size:11px;background:var(--amber-bg);color:var(--amber);padding:1px 7px;border-radius:99px;font-weight:600}
.side-foot{margin-top:auto}
.collapsed .lbl,.collapsed .brand-txt,.collapsed .nav .cnt{display:none}
.collapsed .nav{justify-content:center}
.main{min-width:0}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:22px 32px 0;max-width:1320px}
.topbar h1{font-size:20px}
.crumb{display:inline-flex;align-items:center;gap:4px;color:var(--mute);font-size:13px;background:none;border:0;padding:0;margin-bottom:6px}
.crumb:hover{color:var(--ink)}
.content{padding:18px 32px 56px;max-width:1320px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line2)}
.card-h h3{font-size:14px}
.card-b{padding:16px 18px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.stat{padding:14px 16px}
.stat .l{color:var(--mute);font-size:12px}
.stat .v{font-size:22px;font-weight:600;margin-top:4px;letter-spacing:-.01em}
.stat .s{font-size:11.5px;color:var(--mute);margin-top:1px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:2fr 1fr;gap:16px}
.stack>*+*{margin-top:16px}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-weight:500;color:var(--mute);font-size:12px;padding:10px 14px;border-bottom:1px solid var(--line);background:#fafaf8;white-space:nowrap}
td{padding:11px 14px;border-bottom:1px solid var(--line2);vertical-align:middle}
tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}
tr.click:hover td{background:#fafaf8}
.tbl-wrap{overflow:auto;border-radius:12px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:500;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.85}
.p-green{background:var(--green-bg);color:var(--green)}.p-amber{background:var(--amber-bg);color:var(--amber)}
.p-red{background:var(--red-bg);color:var(--red)}.p-blue{background:var(--blue-bg);color:var(--blue)}.p-grey{background:var(--grey-bg);color:var(--grey)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:7px 12px;border-radius:8px;border:1px solid var(--line);background:#fff;font-size:13px;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--soft)}
.btn.pri{background:var(--gold-d);color:#fff;border-color:var(--gold-d)}
.btn.pri:hover{background:var(--gold-dd)}
.btn.danger{color:var(--red)}
.btn.sm{padding:4px 9px;font-size:12px;border-radius:7px}
.btn.ghost{border-color:transparent;background:none}
.btn.ghost:hover{background:var(--soft)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.inp{border:1px solid var(--line);border-radius:8px;padding:8px 11px;background:#fff;outline:none;width:100%;font-size:13.5px}
.inp:focus{border-color:var(--gold);box-shadow:0 0 0 3px #c2941b22}
textarea.inp{resize:vertical;min-height:72px}
select.inp{width:auto;cursor:pointer}
.search{position:relative;flex:1;min-width:220px;max-width:360px}
.search .ic{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--mute)}
.search input{padding-left:33px}
.muted{color:var(--mute)}.small{font-size:12px}.b{font-weight:600}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;background:var(--soft);border-radius:6px;font-size:12px;color:var(--ink2);margin:2px 4px 2px 0;white-space:nowrap}
.chip button{border:0;background:none;padding:0;color:var(--mute);display:flex}
.chip button:hover{color:var(--red)}
.avatar{width:34px;height:34px;border-radius:50%;background:#ebe8e1;display:grid;place-items:center;font-weight:600;color:#5d584e;font-size:12.5px;flex:none}
.avatar.lg{width:56px;height:56px;font-size:18px}
.who{display:flex;align-items:center;gap:10px;min-width:0}
.who .n{font-weight:500}
.bar{height:6px;background:var(--grey-bg);border-radius:99px;overflow:hidden;min-width:80px}
.bar i{display:block;height:100%;background:var(--gold);border-radius:99px}
.bar.full i{background:var(--red)}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field>label,.flabel{font-size:12.5px;font-weight:500;color:var(--ink2)}
.hint{font-size:11.5px;color:var(--mute)}
.row{display:flex;gap:12px}.row>*{flex:1;min-width:0}
.sec-t{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);font-weight:600;margin:6px 0 12px}
.overlay{position:fixed;inset:0;background:#1f23284d;display:flex;align-items:flex-start;justify-content:center;z-index:100;padding:6vh 16px;overflow:auto}
.modal{background:#fff;border-radius:14px;width:100%;max-width:540px;box-shadow:0 24px 60px #00000026}
.modal.wide{max-width:780px}
.modal-h{padding:16px 20px;border-bottom:1px solid var(--line2);display:flex;justify-content:space-between;align-items:center;gap:10px}
.modal-h h3{font-size:15px}
.modal-b{padding:18px 20px;max-height:70vh;overflow:auto}
.modal-f{padding:14px 20px;border-top:1px solid var(--line2);display:flex;justify-content:flex-end;gap:8px}
.overlay.sheet-o{align-items:flex-end;padding:0}
.modal.sheet{max-width:430px;border-radius:22px 22px 0 0}
#toast-root{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:#1f2328;color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;box-shadow:0 8px 24px #0003;animation:tin .2s ease}
@keyframes tin{from{opacity:0;transform:translateY(6px)}}
.checklist{border:1px solid var(--line);border-radius:8px;max-height:230px;overflow:auto}
.checklist label{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line2);font-size:13px;cursor:pointer}
.checklist label:last-child{border-bottom:0}
.checklist label:hover{background:#fafaf8}
.gchk{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:8px;padding:6px 10px;margin:0 6px 6px 0;cursor:pointer;font-size:13px}
.gchk:has(input:checked){border-color:var(--gold);background:var(--gold-bg)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:14px}
.tabs button{background:none;border:0;padding:9px 12px;color:var(--mute);border-bottom:2px solid transparent;margin-bottom:-1px;font-size:13.5px}
.tabs button.on{color:var(--ink);border-color:var(--gold);font-weight:500}
.notice{background:#fbf6e6;border:1px solid #efe0b0;color:#6b5418;padding:10px 14px;border-radius:10px;font-size:12.5px;display:flex;gap:9px;align-items:flex-start}
.notice.info{background:#f1f5f9;border-color:#dde5ee;color:#3b4d60}
.thumb{width:40px;height:40px;border-radius:8px;object-fit:cover;flex:none;display:block;border:1px solid var(--line2)}
.empty{padding:30px;text-align:center;color:var(--mute)}
.kv{display:grid;grid-template-columns:minmax(90px,110px) 1fr;gap:9px 12px;font-size:13px;margin:0}
.kv dt{color:var(--mute)}.kv dd{margin:0;min-width:0;word-break:break-word}
.list-item{display:flex;align-items:center;gap:12px;padding:11px 18px;border-bottom:1px solid var(--line2)}
.list-item:last-child{border-bottom:0}
.list-item.click{cursor:pointer}.list-item.click:hover{background:#fafaf8}
.grp-list .nav{justify-content:space-between}
.rcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.rcard{overflow:hidden}
.rcard img{width:100%;height:150px;object-fit:cover;display:block;border-bottom:1px solid var(--line2)}
.rcard.off img{filter:grayscale(1);opacity:.6}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}
.linkbox{display:flex;gap:8px;align-items:center;background:var(--soft);border-radius:8px;padding:8px 10px}
.linkbox .mono{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pre{white-space:pre-wrap;background:#f4f7f2;border:1px solid #e1e8dc;border-radius:12px;padding:14px 16px;font-size:13px;max-width:440px}
.cap-ctl{display:flex;align-items:center;gap:6px}
.cap-ctl button{width:26px;height:26px;border-radius:6px;border:1px solid var(--line);background:#fff;display:grid;place-items:center;padding:0}
.camp-hero{display:flex;gap:16px;align-items:center}
.camp-hero img{width:72px;height:72px;border-radius:12px;object-fit:cover}
.typepick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px}.typepick label{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:12px;cursor:pointer}.typepick label:has(input:checked){border-color:var(--gold);background:var(--gold-bg)}.typepick b{display:block;font-size:13.5px}.typepick span{font-size:12px;color:var(--mute)}
#cform[data-type=open] .only-single{display:none}#cform[data-type=single] .only-open{display:none}
#otypebox[data-ot=''] .field,#otypebox[data-ot=budget] .ot-menu,#otypebox[data-ot=menu] .ot-budget{display:none}
.slotrow{display:flex;gap:8px;align-items:center;margin-bottom:8px}.slotrow .inp{width:130px}
.slotpick{display:flex;flex-wrap:wrap;gap:8px}.slotpick label{flex:1 1 45%;border:1px solid #ddd5ca;border-radius:12px;padding:10px 12px;cursor:pointer;font-size:14px;font-weight:500;background:#fff}.slotpick label small{display:block;font-weight:400;color:#8a8278;font-size:12px}.slotpick label:has(input:checked){border-color:var(--gold);background:var(--gold-bg)}.slotpick label.off{opacity:.45;cursor:not-allowed}.slotpick input{display:none}
.platform-row{display:grid;grid-template-columns:150px 1fr 1fr 34px;gap:8px;margin-bottom:8px;align-items:center}

@media (max-width:980px){.grid2,.grid3{grid-template-columns:1fr}}
@media (max-width:760px){
 .admin,.admin.collapsed{grid-template-columns:60px 1fr}
 .side .lbl,.side .brand-txt,.side .nav .cnt{display:none}.side .nav{justify-content:center}
 .content{padding:14px}.topbar{padding:16px 14px 0;flex-wrap:wrap}
 .demobar-note{display:none}.seg button{padding:5px 8px}
 .row{flex-direction:column;gap:0}.platform-row{grid-template-columns:1fr 1fr}
}

/* registration */
.reg-bg{min-height:calc(100vh - 46px);background:#f3f0ea;padding:40px 16px 60px}
.reg{max-width:560px;margin:0 auto}
.reg-head{text-align:center;margin-bottom:24px}
.reg-head h1{font-family:Fraunces,serif;font-weight:500;font-size:30px;margin-top:14px}
.reg-head p{color:#6f675d;margin:8px 0 0}
.reg .card{border-radius:16px;padding:24px}
.brands{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin-top:14px}
.brands span{font-size:11.5px;color:#7a7268;background:#fff;border:1px solid #e6dfd3;padding:3px 9px;border-radius:99px}

/* portal */
.pbg{min-height:calc(100vh - 46px);background:#ebe5dc;display:flex;justify-content:center}
.phone{width:100%;max-width:430px;background:#fbf8f4;min-height:calc(100vh - 46px);position:relative;padding-bottom:84px}
.p-pad{padding:22px 20px}
.serif{font-family:Fraunces,serif}
.p-hello{font-family:Fraunces,serif;font-size:27px;font-weight:500;line-height:1.15}
.p-sub{color:#776f65;margin-top:4px}
.p-sec{padding:20px 20px 6px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#8d857a;font-weight:600}
.icard{margin:12px 16px 16px;background:#fff;border-radius:20px;overflow:hidden;box-shadow:0 1px 2px #0000000d,0 8px 24px #3b2a1a12}
.icard .img{position:relative;border-bottom:1px solid #f1ece4}
.icard img{width:100%;height:178px;object-fit:cover;display:block}
.icard .badge{position:absolute;top:12px;left:12px;background:#fffffff0;padding:4px 10px;border-radius:99px;font-size:11.5px;font-weight:600}
.icard .badge.full{background:#1f2328;color:#fff;letter-spacing:.06em}
.icard .bd{padding:16px 18px 18px}
.rname{font-family:Fraunces,serif;letter-spacing:.09em;font-size:20px;font-weight:600;text-transform:uppercase}
.cname{color:#776f65;font-size:13px;margin-top:2px}
.meta{display:flex;flex-wrap:wrap;gap:6px 16px;color:#5c554c;font-size:13.5px;margin-top:12px}
.meta span{display:flex;align-items:center;gap:6px}
.spots{display:flex;align-items:center;justify-content:space-between;margin-top:14px;font-size:13px;font-weight:500}
.dots{display:flex;gap:3px;flex-wrap:wrap;max-width:60%}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--gold)}
.dots i.free{background:#e3ddd3}
.offer{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}.ochip{background:#f3eee7;color:#4a433a;font-size:12.5px;font-weight:500;padding:4px 10px;border-radius:99px}
.lstrip{height:150px;display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:74px;gap:1px;background:#f1ece4;overflow:hidden}.icard .lstrip img{width:100%;height:74px!important;object-fit:contain;background:#fff;padding:8px}
.phone .inp{border-radius:12px;padding:12px 13px;border-color:#ddd5ca;font-size:15px;background:#fff}
.phone .field>label{font-size:13px}
.regstrip{display:flex;gap:6px;margin-top:16px;flex-wrap:wrap}.regstrip img{width:44px;height:44px;border-radius:10px;object-fit:cover;border:1px solid #ece5db;background:#fff}
.steps{text-align:left;margin:24px 0 6px;display:flex;flex-direction:column;gap:14px}.steps>div{display:flex;gap:12px;align-items:flex-start}.steps span{width:26px;height:26px;border-radius:50%;background:var(--gold-bg);color:var(--gold-dd);display:grid;place-items:center;font-weight:600;font-size:13px;flex:none}.steps b{display:block;font-weight:600;font-size:14px}.steps small{color:#8a8278;font-size:12.5px}
.wa{background:#e9e1d6;border-radius:16px;padding:12px;margin-top:18px}.wa-h{display:flex;align-items:center;gap:8px;font-weight:600;font-size:13px;margin-bottom:8px}.wa-h img{width:22px}.wa-b{background:#fff;border-radius:4px 14px 14px 14px;padding:10px 12px;font-size:13.5px;line-height:1.45;word-break:break-word}.wa-t{text-align:right;font-size:11px;color:#9a9288;margin-top:4px}
.pdesc{color:#6f675d;font-size:13.5px;margin-top:10px}
.pbtn{width:100%;padding:14px;border-radius:14px;border:0;background:var(--gold-d);color:#fff;font-weight:600;font-size:15px;margin-top:16px;display:flex;align-items:center;justify-content:center;gap:8px}
.pbtn.ghost{background:#fff;border:1px solid #ddd5ca;color:var(--ink)}
.pbtn.ok{background:#e6f1ea;color:#2f7d4f}
.pbtn:disabled{background:#e8e3db;color:#8a8278;cursor:not-allowed}
.pinp{width:100%;min-width:0;border:1px solid #ddd5ca;border-radius:12px;padding:13px 14px;background:#fff;font-size:15px;outline:none}
.pinp:focus{border-color:var(--gold)}
.otp{letter-spacing:.5em;text-align:center;font-size:22px;font-weight:600}
.bnav{position:fixed;bottom:0;width:100%;max-width:430px;background:#fffffff5;backdrop-filter:blur(8px);border-top:1px solid #ece5db;display:flex;padding:8px 6px calc(10px + env(safe-area-inset-bottom));z-index:20}
.bnav button{flex:1;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:#8a8278;padding:4px}
.bnav button.on{color:var(--gold-d);font-weight:600}
.bk{margin:10px 16px;background:#fff;border-radius:16px;padding:14px;display:flex;gap:12px;align-items:center;box-shadow:0 1px 2px #0000000a}
.bk img{width:56px;height:56px;border-radius:12px;object-fit:cover;border:1px solid #efe9e0}
.bk .t{font-weight:600}.bk .s{font-size:12.5px;color:#776f65}
.ref{font-family:ui-monospace,Menlo,monospace;font-size:12px;background:#f3eee7;padding:2px 7px;border-radius:6px}
.p-err{background:#fbe9e5;color:#9b3526;padding:10px 12px;border-radius:10px;font-size:13px;margin-top:12px}
.p-demo{background:#fff6dc;border:1px dashed #e2c46e;color:#6b5418;padding:10px 12px;border-radius:12px;font-size:12.5px;margin-top:14px}
.p-empty{margin:12px 16px;padding:24px;text-align:center;color:#8a8278;background:#fff;border-radius:16px;font-size:13.5px}
.success-ic{width:64px;height:64px;border-radius:50%;background:#e6f1ea;color:#2f7d4f;display:grid;place-items:center;margin:0 auto 14px}
.demo-list button{display:flex;width:100%;align-items:center;gap:10px;background:#fff;border:1px solid #e6dfd3;border-radius:12px;padding:9px 12px;margin-top:6px;text-align:left}
input[type=checkbox]{accent-color:var(--gold-d)}
.reg .sec-t{color:var(--gold-d)}

/* ============ Friendly look: warm, rounded, gold only ============ */
:root{--bg:#fdfaf3;--line:#f0e8d6;--line2:#f6f0e2;--soft:#f8f3e6;--radius:20px;--shadow:0 1px 2px #6b54140a,0 10px 30px #6b541410;--serif:Fraunces,Georgia,serif}
body{background:linear-gradient(180deg,#fff8e8 0,#fdfaf3 240px) no-repeat,var(--bg);background-color:var(--bg)}
.card{border-radius:var(--radius);border-color:var(--line);box-shadow:var(--shadow)}
.card-h{padding:16px 22px;border-bottom-color:var(--line2)}
.card-h h3{font-size:15px;font-weight:600}
.card-b{padding:20px 22px}
.btn{border-radius:99px;padding:8px 16px;border-color:#eadfc4}
.btn:hover{background:var(--gold-bg)}
.btn.pri{background:linear-gradient(135deg,#c79a1f,#a67c12);border-color:transparent;box-shadow:0 4px 12px #a67c1233}
.btn.pri:hover{background:linear-gradient(135deg,#b88a14,#8c690f)}
.btn.sm{padding:5px 12px}
.inp{border-radius:12px;border-color:#eadfc4;padding:9px 13px}
.tbl-wrap{border-radius:var(--radius)}
th{background:#fcf8ee;border-bottom-color:var(--line)}
tr.click:hover td{background:#fdf9ef}
.list-item.click:hover{background:#fdf9ef}
.pill{padding:3px 11px}
.chip{border-radius:99px;background:var(--gold-bg);padding:3px 10px}
.tabs button.on{border-color:var(--gold-d)}
.modal{border-radius:24px}
.modal-h,.modal-f{border-color:var(--line2)}
.avatar{background:var(--gold-bg);color:var(--gold-dd)}
.thumb{border-radius:12px}
.rcard img{height:160px}

/* sidebar */
.side{background:#fff;border-right:1px solid var(--line);padding:18px 14px;gap:4px;box-shadow:2px 0 24px #6b54140a}
.brand{padding:6px 8px 18px}
.brand-t{font-family:var(--serif);font-size:17px;font-weight:600}
.nav{padding:11px 13px;border-radius:14px;font-size:14px;font-weight:500;color:var(--ink2)}
.nav:hover{background:var(--soft)}
.nav .em{font-size:19px;width:24px;text-align:center;line-height:1;flex:none}
.nav.on{background:linear-gradient(90deg,#fbefc9,#fdf6e2);box-shadow:none;color:var(--ink);font-weight:600}
.nav .cnt{background:var(--gold-d);color:#fff;min-width:22px;text-align:center;padding:2px 7px}
.side-card{margin:auto 0 8px;padding:16px;border-radius:18px;background:linear-gradient(160deg,#fdf3d6,#fffaf0);border:1px solid #f1e3b8}
.side-card .sc-t{font-weight:600;margin-bottom:4px}
.side-card .sc-s{font-size:12.5px;color:var(--ink2);margin-bottom:12px}
.side-card .btn{width:100%}
.side-foot{margin-top:0}
.collapsed .side-card{display:none}
@media (max-width:760px){.side .side-card{display:none}.nav .em{font-size:20px}}

/* page header */
.topbar h1{font-family:var(--serif);font-size:28px;font-weight:600;letter-spacing:-.01em}
.topbar{padding-top:28px}
.topbar:not(:has(h1:not(:empty))):not(:has(.btn)):not(:has(.crumb)){display:none}
.content{padding-top:22px}

/* overview */
.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin:6px 0 20px}
.greet{font-family:var(--serif);font-size:34px;font-weight:600;letter-spacing:-.015em;line-height:1.15;text-wrap:balance}
.greet-s{margin:8px 0 0;color:var(--ink2);font-size:15.5px}
.hero-date{background:#fff;border:1px solid var(--line);border-radius:99px;padding:8px 16px;font-size:13px;color:var(--ink2);box-shadow:var(--shadow);white-space:nowrap}
.tip{display:flex;align-items:center;gap:16px;padding:16px 20px;border-radius:var(--radius);background:linear-gradient(100deg,#fbeec8,#fdf6e2 60%,#fffaf0);border:1px solid #f1e3b8;margin-bottom:20px}
.tip-ic{width:46px;height:46px;border-radius:14px;background:#fff;display:grid;place-items:center;font-size:23px;flex:none;box-shadow:0 2px 8px #a67c121f}
.tip-t{flex:1;min-width:0}
.tip-t .b{font-size:15px;margin-bottom:2px}
.big{padding:26px 28px;margin-bottom:20px}
.big-h h2{font-family:var(--serif);font-size:22px;font-weight:600}
.big-h p{margin:4px 0 18px}
.acts{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:18px}
.act{display:flex;flex-direction:column;text-align:left;background:#fff;border:1px solid var(--line);border-radius:20px;padding:0;overflow:hidden;transition:transform .15s,box-shadow .15s,border-color .15s}
.act:hover{transform:translateY(-3px);box-shadow:0 14px 34px #6b54141f;border-color:#e6cf8f}
.act:focus-visible{outline:3px solid #c2941b66;outline-offset:2px}
.act-top{display:flex;gap:14px;padding:20px 20px 16px}
.act-em{width:46px;height:46px;border-radius:14px;background:var(--gold-bg);display:grid;place-items:center;font-size:22px;flex:none}
.act-t{font-weight:600;font-size:16px}
.act-d{color:var(--ink2);margin-top:3px;font-size:13.5px}
.act-art{height:104px;display:grid;place-items:center;font-size:46px;background:linear-gradient(135deg,#fdf0cd,#f6dc9c)}
.act-go{padding:14px 20px;display:flex;justify-content:space-between;font-weight:600;color:var(--gold-dd)}
.stats{gap:14px;margin-bottom:20px}
.stat{padding:16px 18px}
.st-top{display:flex;align-items:center;gap:9px}
.st-em{width:30px;height:30px;border-radius:10px;background:var(--gold-bg);display:grid;place-items:center;font-size:15px;flex:none}
.stat .l{font-size:12.5px}
.stat .v{font-size:28px;margin-top:10px;font-family:var(--serif);font-weight:600}
@media (max-width:760px){.greet{font-size:26px}.big{padding:20px 16px}.tip{flex-wrap:wrap}}

/* registration and blogger portal */
.reg-bg{background:linear-gradient(180deg,#fff4d9,#fdf8ee 320px)}
.reg .card{border-radius:24px}
.pbg{background:#f4ead2}
.phone{background:#fffcf5}
.icard{border-radius:24px}
.icard .badge{box-shadow:0 2px 8px #0000001a}
.pbtn{border-radius:99px;background:linear-gradient(135deg,#c79a1f,#a67c12);box-shadow:0 6px 16px #a67c1238}
.pbtn.ghost{background:#fff;box-shadow:none}
.pbtn.ok{box-shadow:none}
.pbtn:disabled{box-shadow:none;background:#ece6d8}
.p-hello{font-size:29px}
.bk{border-radius:20px}
.bnav button{gap:2px;font-size:11.5px}
.bnav .bem{font-size:21px;line-height:1.1;filter:grayscale(.85);opacity:.7}
.bnav button.on .bem{filter:none;opacity:1}
.bnav button.on{color:var(--gold-dd)}
.p-sec{color:var(--gold-dd)}

.stats{grid-template-columns:repeat(auto-fit,minmax(124px,1fr))}
.act-top{flex:1}

.stat{text-align:left;font:inherit;color:inherit;cursor:pointer;transition:transform .15s,box-shadow .15s,border-color .15s}
.stat:hover{transform:translateY(-3px);box-shadow:0 14px 30px #6b541420;border-color:#e6cf8f}
.stat:focus-visible{outline:3px solid #c2941b66;outline-offset:2px}
.st-go{margin-top:8px;font-size:12px;font-weight:600;color:var(--gold-dd);opacity:0;transition:opacity .15s}
.stat:hover .st-go,.stat:focus-visible .st-go{opacity:1}
@media (hover:none){.st-go{opacity:1}}
.jtabs{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin-bottom:16px}
.jtabs button{display:flex;gap:14px;align-items:center;text-align:left;background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px 18px;box-shadow:var(--shadow);transition:border-color .15s,box-shadow .15s}
.jtabs button>span{font-size:26px;width:48px;height:48px;border-radius:14px;background:var(--gold-bg);display:grid;place-items:center;flex:none}
.jtabs button b{display:block;font-size:15.5px}.jtabs button small{color:var(--ink2);font-size:12.5px}
.jtabs button:hover{border-color:#e6cf8f}
.jtabs button.on{border-color:var(--gold-d);box-shadow:0 0 0 3px #c2941b26,var(--shadow)}
.jrow{display:flex;gap:26px;overflow-x:auto;padding:6px 4px 22px;margin-bottom:6px;scroll-snap-type:x proximity}
.jstep{flex:none;width:340px;scroll-snap-align:start}
.jlab{display:flex;gap:10px;align-items:flex-start;margin-bottom:12px;min-height:46px}
.jn{width:26px;height:26px;border-radius:50%;background:var(--gold-d);color:#fff;display:grid;place-items:center;font-weight:600;font-size:12.5px;flex:none;margin-top:1px}
.pf{position:relative;height:640px;border-radius:34px;border:8px solid #2a2d33;background:#fffcf5;overflow:hidden;box-shadow:0 18px 40px #3b2a1a26}
.pf-scroll{height:100%;overflow-y:auto;scrollbar-width:none}
.pf-scroll::-webkit-scrollbar{display:none}
.pf *{pointer-events:none}
.pf-scroll{pointer-events:auto}
.pf .bnav{position:sticky;bottom:0;max-width:none;width:100%}
.pf-dim{position:absolute;inset:0;background:#1f232859}
.pf-sheet{pointer-events:auto;scrollbar-width:none;position:absolute;left:0;right:0;bottom:0;max-height:84%;overflow-y:auto;background:#fff;border-radius:24px 24px 0 0;padding:10px 18px 18px;box-shadow:0 -10px 30px #0003}
.pf-grab{width:38px;height:4px;border-radius:9px;background:#ddd5ca;margin:0 auto 10px}
.pf-sheet .pbtn{margin-top:10px;padding:12px}
.jrules{margin:0;padding-left:20px;display:grid;gap:8px;font-size:14px}
.pf-sheet::-webkit-scrollbar{display:none}
.pf-sheet img{height:84px!important}
.pf{height:680px}
.slotrow{flex-wrap:wrap}.slotrow select.inp{width:122px}

.slotrow{display:grid;grid-template-columns:repeat(var(--n,3),minmax(0,1fr)) 34px;gap:10px;align-items:center;margin-bottom:10px}
.slotrow .inp{width:100%!important}
.slothead{margin-bottom:6px}.slothead span{font-size:12px;color:var(--mute);font-weight:500}
.slotfoot{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:2px}
.slottotal{background:var(--gold-bg);border:1px solid #f1e3b8;border-radius:99px;padding:7px 15px;font-size:13.5px}
.slotlist{display:grid;gap:6px;margin-top:12px}
.slotlist .sl{display:flex;align-items:center;gap:12px;background:#fbf5e6;border-radius:12px;padding:8px 12px;font-size:13px}
.slotlist .sl span{display:flex;gap:5px;align-items:center}.slotlist .sl b{margin-left:auto;color:var(--gold-dd)}
.slotlist .sl.off{opacity:.55}.slotlist .sl.off b{color:#9b3526}
@media (max-width:640px){.slotrow{grid-template-columns:1fr 1fr 34px}.slotrow[style*="--n:4"]>:first-child{grid-column:1/-1}.slothead{display:none}}

.ptabs{display:grid;grid-template-columns:1fr 1fr;background:#f1ebe2;border-radius:99px;padding:4px;gap:4px}
.ptabs button{border:0;background:none;padding:10px 0;border-radius:99px;font-weight:600;font-size:15px;color:#776f65}
.ptabs button.on{background:#fff;color:var(--ink);box-shadow:0 2px 8px #3b2a1a1a}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
.optcard{text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:20px;padding:18px 20px;box-shadow:var(--shadow);transition:border-color .15s,box-shadow .15s,transform .15s}
.optcard:hover{border-color:#e6cf8f;transform:translateY(-2px)}
.optcard.on{border-color:var(--gold-d);box-shadow:0 0 0 3px #c2941b26,var(--shadow)}
.opt-top{display:flex;justify-content:space-between;align-items:center}
.opt-em{width:44px;height:44px;border-radius:14px;background:var(--gold-bg);display:grid;place-items:center;font-size:22px}
.opt-sel{font-size:12.5px;font-weight:600;color:var(--gold-dd);background:var(--gold-bg);padding:4px 12px;border-radius:99px}
.optcard.on .opt-sel{background:var(--gold-d);color:#fff}
.opt-t{font-family:var(--serif);font-weight:600;font-size:20px;margin-top:12px}
.opt-d{color:var(--ink2);margin:6px 0 10px}
.optcard ul{margin:0 0 12px;padding-left:18px;color:var(--ink2);display:grid;gap:4px}
.opt-cost{font-weight:600;font-size:13px;color:var(--gold-dd)}
.gs{padding:22px 26px;margin-bottom:20px}
.gs-h{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:12px}.gs-h h2{font-family:var(--serif);font-size:22px;font-weight:600}
.gs-row{display:flex;align-items:center;gap:16px;padding:12px 0;border-top:1px solid var(--line2)}
.gs-n{width:34px;height:34px;border-radius:99px;display:grid;place-items:center;font-weight:700;background:#f3eee0;color:var(--ink2);flex:none}
.gs-row.cur .gs-n{background:var(--gold-d);color:#fff}.gs-row.done .gs-n{background:var(--green-bg);color:var(--green)}
.gs-t{flex:1;min-width:0}.gs-row.done .gs-t b{text-decoration:line-through;color:var(--mute)}
.p-note{background:#fff6dc;border:1px solid #efdca3;color:#6b5418;padding:10px 12px;border-radius:10px;font-size:13px;margin-top:12px}
.grid3>*,.grid2>*{min-width:0}
.list-item .pill{white-space:nowrap}
.today{margin-bottom:20px}.today .card-h{gap:12px}
.today-r{padding:10px 22px;border-top:1px solid var(--line2);display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.today-v{display:inline-flex;gap:6px;align-items:center;background:var(--gold-bg);border-radius:99px;padding:4px 12px;font-size:13px}
.qf{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}.qf button{font:inherit;font-size:13px;border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 14px;cursor:pointer}.qf button.on{background:var(--gold-bg);border-color:var(--gold-d);color:var(--gold-dd);font-weight:600}
[dir=rtl] .rname,[dir=rtl] .cname{letter-spacing:0;font-family:inherit}
[dir=rtl] .p-hello{font-family:inherit;font-weight:700}
[dir=rtl] .kv dt{text-align:right}
[dir=rtl] .crumb svg,[dir=rtl] .ic-back{transform:scaleX(-1)}
.langsw{position:absolute;top:14px;inset-inline-end:14px;z-index:5;border:1px solid #e2d6bf;background:#fff;border-radius:99px;padding:5px 12px;font:inherit;font-size:13px;font-weight:600;color:var(--gold-dd);cursor:pointer}
.tpick{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch}
.tpick label{flex:none;border:1px solid #ddd5ca;border-radius:99px;padding:9px 15px;font-weight:600;font-size:14px;background:#fff;cursor:pointer;scroll-snap-align:start;white-space:nowrap}
.tpick label:has(input:checked){border-color:var(--gold);background:var(--gold-bg);color:var(--gold-dd)}
.tpick input{position:absolute;opacity:0;pointer-events:none}.tpick label.off{opacity:.35;cursor:default}
.flabel{display:block;font-weight:600;font-size:13px;margin-bottom:6px}
.wlb{display:block;width:100%;margin-top:8px;border:1px dashed #c9a24b;background:#fffaf0;color:var(--gold-dd);border-radius:10px;padding:7px 8px;font:inherit;font-size:12.5px;font-weight:600;cursor:pointer;pointer-events:auto}
.wlb.on{border-style:solid;background:var(--gold-bg)}
.slotpick label.off:has(.wlb){opacity:1}.slotpick label.off:has(.wlb)>small{opacity:.6}
.remind{margin:10px 16px;background:#fff6dc;border:1px solid #efdca3;border-radius:16px;padding:14px;color:#5b4613}
.modal .remind{margin:0 0 14px}
.bulkbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--gold-bg);border:1px solid #ecdcae;border-radius:12px;padding:10px 14px;margin-bottom:10px;position:sticky;top:8px;z-index:4}
.brrow{display:grid;grid-template-columns:1fr 1.4fr auto auto;gap:8px;align-items:center;margin-bottom:8px}
.brrow.bk2{grid-template-columns:170px 1fr auto auto}
.flagcard{margin-bottom:16px;border-color:#f0cdc6;background:#fffafa}.flagcard .card-h h3{color:var(--red)}
.msggrid{display:grid;grid-template-columns:260px 1fr;gap:16px}
@media (max-width:760px){.msggrid{grid-template-columns:1fr}.brrow,.brrow.bk2{grid-template-columns:1fr auto}.brrow>input:nth-child(2){grid-column:1/2}}
tr.grp td{background:var(--gold-bg);font-weight:600;color:var(--gold-dd);padding:8px 14px}
</style>

const clashMsg=r=>T('You already have a visit on {0} at {1}. You can visit one restaurant per day.',fmtD(rInfo(r).date),rInfo(r).where);
/* branches, blocked dates, exact arrival times */
const brOf=(r,id)=>r&&r.branches&&r.branches.length?(r.branches.find(x=>x.id===id)||r.branches[0]):{id:'',name:(r&&r.location)||'',maps:(r&&r.maps)||''};

const isExact=c=>!!c&&c.pick==='time';

/* messages: one editable text per message, in English and Arabic */
function msgText(k,l){const m=DB.settings.msgs&&DB.settings.msgs[k];if(k==='invite')return l==='ar'?(DB.settings.templateAr||MSG_DEF.invite.ar):DB.settings.template;return (m&&m[l])||MSG_DEF[k][l]||MSG_DEF[k].en}
function tpl(key,b,vars){const prev=LANG;LANG=(b&&b.lang)||'en';try{const v=Object.assign({},typeof vars==='function'?vars():(vars||{}));v.name=first(b.name);if(v.link==null)v.link=SIGNIN_URL;

/* Plan a booking without saving it. Used for new bookings and for changes. */
function planBooking(c,b,o){
  if(cStatus(c)!=='Active') return {ok:false,msg:cStatus(c)==='Paused'?T('Bookings for this invitation are paused.'):T('This invitation is no longer open for booking.')};
  if(!isOpen(c)){
    if(DB.reservations.some(r=>r.campaignId===c.id&&r.bloggerId===b.id&&r.status!=='Cancelled')) return {ok:false,msg:T('You already have a reservation for this invitation.')};
    const sls=slotsOf(c);const sl=sls[o&&o.slotIdx!=null&&o.slotIdx!==''?+o.slotIdx:0];
    if(!sl) return {ok:false,msg:T('Please choose one of the time slots.')};
    const rest=rs(c.restaurantId);const bk=blockedOn(c.restaurantId,sl.date);if(bk)return {ok:false,msg:blockMsg(rest,bk)};
    let time=sl.start;if(isExact(c)){time=o.time;if(!time||!timesIn(sl,c.step).includes(time))return {ok:false,msg:T('Please choose your arrival time.')}}
    if(at(sl.date,time)<=new Date()) return {ok:false,msg:T('That time has already passed.')};
    {const cl=dayClash(b.id,sl.date);if(cl)return {ok:false,msg:clashMsg(cl)}}
    if(slotLeft(c,sl)<=0) return {ok:false,msg:sls.length>1?T('Sorry, that time slot is fully booked. Please choose another one.'):T('Sorry, the last table was just taken. This invitation is fully booked.'),full:true,wl:{date:sl.date,slotStart:sl.start}};
    return {ok:true,f:{restaurantId:c.restaurantId,branchId:brOf(rest,c.branchId).id,date:sl.date,time,slotStart:sl.start,slotEnd:isExact(c)?null:sl.end,winEnd:sl.end}};
  }
  const rest=rs(o.restaurantId);const date=o.date;
  if(!rest||!c.restaurantIds.includes(o.restaurantId)||!rest.active) return {ok:false,msg:T('This restaurant is not part of the invitation.')};
  const br=brOf(rest,o.branchId);
  if(!date||date<c.startDate||date>c.endDate) return {ok:false,msg:T('Please pick a date between {0} and {1}.',fmtD(c.startDate),fmtD(c.endDate))};
  {const bk=blockedOn(rest.id,date);if(bk)return {ok:false,msg:blockMsg(rest,bk)}}
  const slot=slotsOf(c).find(x=>x.start===(o.slotStart||o.time));if(!slot) return {ok:false,msg:T('Please pick one of the available time slots.')};
  let time=slot.start;if(isExact(c)){time=o.time;if(!time||!timesIn(slot,c.step).includes(time))return {ok:false,msg:T('Please choose your arrival time.')}}
  if(at(date,time)<=new Date()) return {ok:false,msg:T('Please pick a time in the future.')};
  if(usedInMonth(c,b.id,date)>=c.perMonth) return {ok:false,msg:T("You've already booked {0} visits for {1}. That's the monthly limit.",c.perMonth,monthName(date)),limit:true};
  {const cl=dayClash(b.id,date);if(cl)return {ok:false,msg:clashMsg(cl)}}
  if(slotCap(c,slot.start)&&dayCount(c,rest.id,date,slot.start,br.id)>=slotCap(c,slot.start)) return {ok:false,msg:T('{0} is fully booked on {1}, {2}. Please choose another slot or day.',whereOf(rest,br),fmtD(date),slotLabel(slot)),full:true,wl:{restaurantId:rest.id,branchId:br.id,date,slotStart:slot.start}};
  return {ok:true,f:{restaurantId:rest.id,branchId:br.id,date,time,slotStart:slot.start,slotEnd:isExact(c)?null:slot.end,winEnd:slot.end}};
}
// Booking is a single atomic step. In production this becomes one Supabase RPC
// (Postgres function) that locks the campaign row, checks capacity and inserts.
function reserveSpot(cid,bid,o={}){
  const c=cp(cid),b=bl(bid);
  if(!c||!b) return {ok:false,msg:T('Invitation not found.')};
  if(!hasAccess(b)) return {ok:false,msg:T('Your account is not active.')};
  if(!DB.invitations.some(i=>i.campaignId===cid&&i.bloggerId===bid)) return {ok:false,msg:T('You were not invited to this campaign.')};
  const p=planBooking(c,b,o);if(!p.ok)return p;
  const r=Object.assign({id:uid('res'),ref:genRef(),campaignId:cid,bloggerId:bid,status:'Confirmed',attendance:'Not marked',bookedAt:Date.now(),cancelledAt:null,cancelledBy:null,notes:''},p.f);
  DB.reservations.push(r);
  DB.waitlist.forEach(w=>{if(w.campaignId===cid&&w.bloggerId===bid&&['Waiting','Notified'].includes(w.status)&&(!isOpen(c)||w.date===r.date))w.status='Booked'});
  notify(bid,'Booking confirmation',tpl('confirmed',b,resVars(r)));
  save();return {ok:true,res:r};
}
const resKey=r=>({restaurantId:r.restaurantId,branchId:r.branchId||brOf(rs(r.restaurantId)).id,date:rInfo(r).date,slotStart:rInfo(r).slotStart});
/* a table opened: everyone waiting for that slot gets a message, first to book gets it */
function freeSeat(c,k){if(!c||!k)return 0;let n=0;DB.waitlist.filter(w=>w.campaignId===c.id&&w.status==='Waiting'&&w.date===k.date&&w.slotStart===k.slotStart&&(!isOpen(c)||(w.restaurantId===k.restaurantId&&(w.branchId||'')===(k.branchId||'')))).forEach(w=>{const b=bl(w.bloggerId);if(!b||!hasAccess(b))return;if(at(w.date,w.slotStart)<=new Date())return;w.status='Notified';w.notifiedAt=Date.now();n++;
  const rest=rs(w.restaurantId);notify(b.id,'Waitlist: table open',tpl('waitlist',b,()=>({restaurant:whereOf(rest,brOf(rest,w.branchId)),date:fmtD(w.date),time:fmtT(w.slotStart)})))});return n}
function onWaitlist(cid,bid,k){return DB.waitlist.find(w=>w.campaignId===cid&&w.bloggerId===bid&&['Waiting','Notified'].includes(w.status)&&(!k||(w.date===k.date&&w.slotStart===k.slotStart&&(!k.restaurantId||w.restaurantId===k.restaurantId)&&(!k.branchId||(w.branchId||'')===k.branchId))))}

/* move a booking to another slot, date or branch. Checks the same rules as a new booking. */
function changeBooking(rid,o,by){
  const r=DB.reservations.find(x=>x.id===rid);if(!r||r.status!=='Confirmed')return {ok:false,msg:T('This booking can no longer be changed.')};
  const c=cp(r.campaignId),b=bl(r.bloggerId);
  if(by==='Blogger'&&!canBloggerCancel(r))return {ok:false,msg:T('Changes close {0} hours before the visit.',c.cancelHours)};
  const oldK=resKey(r);r.status='Cancelled';let p;try{p=planBooking(c,b,o)}finally{r.status='Confirmed'}
  if(!p.ok)return p;
  const same=p.f.date===oldK.date&&p.f.slotStart===oldK.slotStart&&p.f.restaurantId===oldK.restaurantId&&p.f.branchId===oldK.branchId&&p.f.time===r.time;

  const pend=DB.bloggers.filter(b=>b.status==='Pending').length;
  const page=S.page;
  let title='',sub='',actions='',body='';
  if(page==='overview'){title='';actions='';body=pgOverview()}
  else if(page==='bloggers'){title='🤳 Microbloggers';sub=`${DB.bloggers.length} registered`;actions=`<button class="btn" data-action="view" data-v="register">📱 Open registration page</button>`;body=pgBloggers()}
  else if(page==='blogger'){const b=bl(S.bloggerId);if(!b){S.page='bloggers';return renderAdmin()}title=esc(b.name);body=pgBlogger(b)}
  else if(page==='groups'){title='👥 Groups';sub='Optional. Use groups only if you want to invite a smaller set of bloggers.';actions=`<button class="btn pri" data-action="newGroup">➕ Create a group</button>`;body=pgGroups()}
  else if(page==='campaigns'){title='✨ Campaigns';sub='Restaurant invitation campaigns';actions=`<button class="btn pri" data-action="newCampaign">✨ New campaign</button>`;body=pgCampaigns()}
  else if(page==='campaign'){const c=cp(S.campaignId);if(!c){S.page='campaigns';return renderAdmin()}title=esc(c.name);body=pgCampaign(c)}
  else if(page==='journey'){title='📱 Blogger journey';sub='See exactly what a blogger sees, step by step, for each type of campaign';body=pgJourney()}
  else if(page==='reservations'){title='📅 Reservations';sub='All bookings across restaurants';body=pgReservations()}
  else if(page==='reports'){title='📊 Brand reports';sub='Visits, attendance and the most active bloggers, per brand and month';actions=`<button class="btn" data-action="reportCsv">⬇️ Download CSV</button>`;body=pgReports()}
  else if(page==='restaurants'){title='🍽️ Restaurants';sub=`${DB.restaurants.length} brands`;actions=`<button class="btn pri" data-action="newRestaurant">➕ Add restaurant</button>`;body=pgRestaurants()}
  else if(page==='settings'){title='⚙️ Settings';sub='Messages, rules and integrations';body=pgSettings()}
  const crumb=page==='blogger'?`<button class="crumb" data-action="nav" data-p="bloggers">${ic('back',14)} Microbloggers</button>`:page==='campaign'?`<button class="crumb" data-action="nav" data-p="campaigns">${ic('back',14)} Campaigns</button>`:'';
  const activeNav=page==='blogger'?'bloggers':page==='campaign'?'campaigns':page;
  $('#app').innerHTML=`<div class="admin ${S.side?'collapsed':''}">
  <aside class="side">
    <div class="brand"><img class="brand-logo" src="${MNH_MARK}" alt="MNH Al-Hajery" style="width:30px;flex:none"><div class="brand-txt"><div class="brand-t">Al-Hajery</div><div class="brand-s">Microblogger Management</div></div></div>
    ${NAV.filter(x=>!(FRESH&&x[0]==='journey')).map(([k,l,i])=>`<button class="nav ${activeNav===k?'on':''}" data-action="nav" data-p="${k}" title="${l}"><span class="em">${i}</span><span class="lbl">${l}</span>${k==='bloggers'&&pend?`<span class="cnt">${pend}</span>`:''}</button>`).join('')}
    ${FRESH?'':`<div class="side-card lbl"><div class="sc-t">📱 See the blogger side</div><div class="sc-s">Try the sign-up page the way a blogger sees it.</div><button class="btn pri" data-action="view" data-v="register">Open sign-up page →</button></div>`}
    <div class="side-foot"><button class="nav" data-action="toggleSide" title="Collapse sidebar"><span class="em">↔️</span><span class="lbl">Collapse</span></button></div>
  </aside>
  <main class="main">
    <div class="topbar"><div>${crumb}<h1>${title}</h1>${sub?`<div class="muted small" style="margin-top:3px">${sub}</div>`:''}</div><div class="btns">${actions}</div></div>
    <div class="content">${body}</div>
  </main></div>`;
}

/* ----- Overview ----- */
function pgOverview(){
  const B=DB.bloggers;
  const st=[['Total registered',B.length,'All applications'],['Pending applications',B.filter(b=>b.status==='Pending').length,'Awaiting review'],['Approved bloggers',B.filter(b=>b.status==='Approved').length,'Can be invited'],['Active bloggers',B.filter(hasAccess).length,'Can sign in'],['Active campaigns',DB.campaigns.filter(c=>cStatus(c)==='Active').length,'Open for booking'],['Confirmed reservations',DB.reservations.filter(r=>r.status==='Confirmed').length,'Not yet completed'],['Upcoming visits',DB.reservations.filter(r=>r.status==='Confirmed'&&!resPast(r)).length,'Scheduled']];
  const recent=[...B].sort((a,b)=>b.createdAt-a.createdAt).slice(0,6);
  const upC=DB.campaigns.filter(c=>!campEnded(c)&&c.status!=='Cancelled').sort((a,b)=>a.date.localeCompare(b.date)).slice(0,5);
  const upV=DB.reservations.filter(r=>r.status==='Confirmed'&&!resPast(r)).sort((a,b)=>(rInfo(a).date+rInfo(a).start).localeCompare(rInfo(b).date+rInfo(b).start)).slice(0,6);
  const SE=['👥','📬','✅','🔗','✨','🎟️','🗓️'],SK=['all','pending','approved','active','camps','conf','upc'];
  const hr=new Date().getHours(),greet=hr<12?'Good morning':hr<18?'Good afternoon':'Good evening';
  const pend=B.filter(b=>b.status==='Pending').length,upN=upV.length,actC=DB.campaigns.filter(c=>cStatus(c)==='Active').length;
  const low=DB.campaigns.filter(c=>cStatus(c)==='Active'&&!isOpen(c)&&!campEnded(c)&&taken(c.id)<c.capacity/2).sort((a,b)=>a.date.localeCompare(b.date))[0];
  const tip=!B.length&&!FRESH?{e:'👋',t:'Welcome! Your workspace is empty',d:'Start by signing up as a test blogger. Then come back here to approve yourself.',b:'Open sign-up page →',a:'view',x:'data-v="register"'}
    :pend?{e:'📬',t:`${pend} application${pend>1?'s are':' is'} waiting for your review`,d:'Approve a blogger and their account is ready to sign in straight away.',b:'Review now →',a:'reviewPending',x:''}
    :low?{e:'💡',t:`${esc(cRestName(low))} still has ${remaining(low)} tables open`,d:`${esc(low.name)} on ${cDateLabel(low)} is less than half booked. You can invite more bloggers.`,b:'Open campaign →',a:'openCampaign',x:`data-id="${low.id}"`}
    :{e:'💡',t:'Everything is up to date',d:'No applications are waiting. Create a new invitation when you are ready.',b:'New invitation →',a:'newCampaign',x:''};
  return `<div class="hero"><div><h1 class="greet">${greet}, Marketing Team 👋</h1><p class="greet-s">${upN?`${upN} blogger visit${upN>1?'s are':' is'} coming up`:'No visits are booked yet'}, and ${actC} campaign${actC===1?' is':'s are'} open for booking.</p></div><div class="hero-date">${new Date().toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'})}</div></div>
  ${FRESH?'':(()=>{const acc=B.find(hasAccess);const steps=[
    ['Sign up as a test blogger','Open the sign-up page and fill it in, the way a blogger would.',B.length>0,'data-action="view" data-v="register"','Open sign-up page'],
    ['Approve the blogger','Open the blogger in Microbloggers and press Approve. They can sign in straight away.',B.some(hasAccess),'data-action="nav" data-p="bloggers"','Go to Microbloggers'],
    ['Create and launch a campaign','Pick a restaurant, set the tables, and invite.',DB.campaigns.some(c=>c.status!=='Draft'),'data-action="newCampaignT" data-t="single"','Create a campaign'],
    ['Book as the blogger','Open the blogger portal, sign in, and reserve a table.',DB.reservations.length>0,acc?`data-action="openPortalAs" data-id="${acc.id}"`:'data-action="view" data-v="portal"','Open blogger portal']];
    if(steps.every(x=>x[2]))return '';
    const cur=steps.findIndex(x=>!x[2]);
    return `<div class="card gs"><div class="gs-h"><h2>🚀 Try the whole journey</h2><span class="muted">Follow these four steps, as the admin and as a blogger.</span></div>${steps.map((x,i)=>`<div class="gs-row ${x[2]?'done':i===cur?'cur':''}"><span class="gs-n">${x[2]?'✓':i+1}</span><div class="gs-t"><b>${x[0]}</b><div class="muted">${x[1]}</div></div>${i===cur?`<button class="btn pri" ${x[3]}>${x[4]} →</button>`:''}</div>`).join('')}</div>`})()}
  ${(()=>{const td=iso(new Date()),tm=addDays(1);const vis=DB.reservations.filter(r=>r.status!=='Cancelled'&&rInfo(r).date===td).sort((a,b)=>(rInfo(a).where+rInfo(a).start).localeCompare(rInfo(b).where+rInfo(b).start));const tmN=DB.reservations.filter(r=>r.status==='Confirmed'&&rInfo(r).date===tm).length;
    const by={};vis.forEach(r=>{const n=rInfo(r).where;(by[n]=by[n]||[]).push(r)});
    return `<div class="card today"><div class="card-h"><h3>📍 Today's visits</h3><span class="muted small" style="margin-left:auto">${vis.length} today · ${tmN} tomorrow</span><button class="btn ghost sm" data-action="resToday" data-s="Today">See list →</button></div>${vis.length?Object.entries(by).map(([n,rs])=>`<div class="today-r"><b style="min-width:110px">${esc(n)}</b>${rs.map(r=>{const i=rInfo(r),b=bl(r.bloggerId);return `<span class="today-v">${fmtT(i.start)} · ${b.flag?'🚩 ':''}${esc(b.name)}${i.c.guests?` +${i.c.guests}`:''}${r.attendance!=='Not marked'?' · '+r.attendance:r.reply==='Yes'?' ✅':r.remindedAt?' ⏳':''}</span>`}).join('')}</div>`).join(''):`<div class="today-r muted">No visits today.${tmN?` <button class="btn ghost sm" data-action="resToday" data-s="Tomorrow">See tomorrow's ${tmN} →</button>`:''}</div>`}</div>`})()}
  <div class="tip"><div class="tip-ic">${tip.e}</div><div class="tip-t"><div class="b">${tip.t}</div><div class="muted">${tip.d}</div></div><button class="btn pri" data-action="${tip.a}" ${tip.x}>${tip.b}</button></div>
  <div class="card big"><div class="big-h"><h2>What would you like to do?</h2><p class="muted">Pick one to get started.</p></div>
    <div class="acts">
      <button class="act" data-action="newCampaignT" data-t="single"><div class="act-top"><span class="act-em">🍽️</span><div><div class="act-t">One restaurant</div><div class="act-d">Invite bloggers to one restaurant on one day.</div></div></div><div class="act-art">🍝</div><div class="act-go">Create invitation <span>→</span></div></button>
      <button class="act" data-action="newCampaignT" data-t="open"><div class="act-top"><span class="act-em">🗓️</span><div><div class="act-t">Open invitation</div><div class="act-d">Let bloggers choose any restaurant, date and time slot.</div></div></div><div class="act-art">🥂</div><div class="act-go">Create invitation <span>→</span></div></button>
      <button class="act" data-action="reviewPending"><div class="act-top"><span class="act-em">📬</span><div><div class="act-t">Review applications</div><div class="act-d">${pend?`${pend} new blogger${pend>1?'s are':' is'} waiting.`:'Approve or reject new bloggers.'}</div></div></div><div class="act-art">🤳</div><div class="act-go">Open applications <span>→</span></div></button>
    </div></div>
  <div class="stats">${st.map((s,i)=>`<button class="card stat" data-action="statGo" data-k="${SK[i]}" title="See the list behind this number"><div class="st-top"><span class="st-em">${SE[i]}</span><div class="l">${s[0]}</div></div><div class="v">${s[1]}</div><div class="s">${s[2]}</div><div class="st-go">See list →</div></button>`).join('')}</div>
  <div class="grid2">
    <div class="card"><div class="card-h"><h3>🆕 Recent registrations</h3><button class="btn ghost sm" data-action="nav" data-p="bloggers">View all ${ic('chev',14)}</button></div>
      ${recent.map(b=>`<div class="list-item click" data-action="openBlogger" data-id="${b.id}"><div class="avatar">${initials(b.name)}</div><div style="flex:1;min-width:0"><div class="b" style="font-weight:500">${esc(b.name)}</div><div class="muted small">@${esc(igOf(b)?.username||'')} · ${fmtTSd(b.createdAt)}</div></div>${pill(b.status)}</div>`).join('')}
    </div>
    <div class="card"><div class="card-h"><h3>✨ Upcoming campaigns</h3><button class="btn ghost sm" data-action="nav" data-p="campaigns">View all ${ic('chev',14)}</button></div>
      ${upC.length?upC.map(c=>`<div class="list-item click" data-action="openCampaign" data-id="${c.id}"><img class="thumb" src="${cThumb(c)}" alt=""><div style="flex:1;min-width:0"><div style="font-weight:500">${esc(cRestName(c))} · ${esc(c.name)}</div><div class="muted small">${cDateLabel(c)} · ${cTimeLabel(c)}</div></div><div style="width:120px">${capCell(c)}</div><div style="width:82px;text-align:right">${pill(cStatus(c))}</div></div>`).join(''):'<div class="empty">No upcoming campaigns</div>'}
    </div>
  </div>
  <div class="card" style="margin-top:16px"><div class="card-h"><h3>🗓️ Upcoming restaurant visits</h3><button class="btn ghost sm" data-action="nav" data-p="reservations">All reservations ${ic('chev',14)}</button></div>
    <div class="tbl-wrap"><table><thead><tr><th>Blogger</th><th>Restaurant</th><th>Visit</th><th>Reference</th><th>Status</th></tr></thead><tbody>
    ${upV.map(r=>{const i=rInfo(r),b=bl(r.bloggerId);return `<tr class="click" data-action="openBlogger" data-id="${b.id}"><td><div class="who"><div class="avatar">${initials(b.name)}</div><div><div class="n">${esc(b.name)}</div><div class="muted small">@${esc(igOf(b)?.username)}</div></div></div></td><td>${esc(i.where)}</td><td>${fmtD(i.date)}<div class="muted small">${tLabel(i)}</div></td><td class="mono">${r.ref}</td><td>${pill(r.status)}</td></tr>`}).join('')||'<tr><td colspan="5" class="empty">No upcoming visits</td></tr>'}
    </tbody></table></div></div>`;
}

function capCell(c){
  const t=taken(c.id);
  if(isOpen(c))return `<div class="small" style="margin-bottom:2px">${t} visit${t===1?'':'s'} booked</div><div class="muted small">Max ${c.perMonth}/blogger/month</div>`;
  return `<div class="small" style="margin-bottom:4px">${t} of ${c.capacity} · <span class="muted">${remaining(c)} left</span></div><div class="bar ${t>=c.capacity?'full':''}"><i style="width:${Math.min(100,t/c.capacity*100)}%"></i></div>`;
}
/* ----- Bloggers ----- */
function filteredBloggers(){
  const q=S.bq.trim().toLowerCase();
  return DB.bloggers.filter(b=>{
    if(S.bstatus==='Flagged'){if(!b.flag)return false}else if(S.bstatus!=='All'&&b.status!==S.bstatus)return false;
    if(S.baccess==='Active'&&!hasAccess(b))return false;
    if(S.bgroup!=='All'&&!DB.memberships.some(m=>m.groupId===S.bgroup&&m.bloggerId===b.id))return false;
    if(!q)return true;
    const hay=[b.name,b.nationality||'',b.username,b.accountId,b.cc+b.phone,b.phone,...socialsOf(b.id).map(s=>s.username)].join(' ').toLowerCase();
    return hay.includes(q);
  }).sort((a,b)=>b.createdAt-a.createdAt);
}
function nextVisitCell(b){
  const r=resOf(b.id).filter(x=>x.status==='Confirmed'&&!resPast(x)).sort((x,y)=>(rInfo(x).date+rInfo(x).start).localeCompare(rInfo(y).date+rInfo(y).start))[0];
  if(!r)return '<span class="muted">—</span>';
  const i=rInfo(r);return `${fmtD(i.date)}<div class="muted small">${esc(i.where)} · ${fmtT(i.start)}</div>`;
}
function bloggersTable(){
  const list=filteredBloggers();
  S.bsel=(S.bsel||[]).filter(id=>bl(id)&&bl(id).status==='Pending');
  const pendShown=list.filter(b=>b.status==='Pending');const allOn=pendShown.length&&pendShown.every(b=>S.bsel.includes(b.id));
  return `${S.bsel.length?`<div class="bulkbar"><b>${S.bsel.length} selected</b><span class="muted small">Pending applications</span><span style="flex:1"></span><button class="btn sm" data-action="bulkClear">Clear</button><button class="btn sm danger" data-action="bulkReject">Reject ${S.bsel.length}</button><button class="btn sm pri" data-action="bulkApprove">${ic('check',14)} Approve ${S.bsel.length}</button></div>`:''}<div class="card"><div class="tbl-wrap"><table><thead><tr><th style="width:34px">${pendShown.length?`<input type="checkbox" data-bselall="1" ${allOn?'checked':''} title="Select all pending">`:''}</th><th>Full name</th><th>System username</th><th>Phone</th><th>Nationality</th><th>Instagram</th><th>Other platforms</th><th>Registered</th><th>Next visit</th><th>Status</th><th>Access</th><th></th></tr></thead><tbody>
  ${list.map(b=>{const ig=igOf(b);const other=socialsOf(b.id).filter(s=>s.platform!=='Instagram');return `<tr class="click" data-action="openBlogger" data-id="${b.id}">
  <td class="nocl">${b.status==='Pending'?`<input type="checkbox" data-bsel="${b.id}" ${S.bsel.includes(b.id)?'checked':''}>`:''}</td><td><div class="who"><div class="avatar">${initials(b.name)}</div><div><div class="n">${b.flag?'<span title="Red flag">🚩</span> ':''}${esc(b.name)}</div><div class="muted small mono">${b.accountId}</div></div></div></td>
  <td class="mono">${esc(b.username)}</td><td style="white-space:nowrap">${esc(b.cc)} ${esc(b.phone)}</td><td>${esc(b.nationality||'—')}</td><td>@${esc(ig?.username)}</td>
  <td>${other.map(s=>`<span class="chip">${esc(s.platform)}</span>`).join('')||'<span class="muted">—</span>'}</td>
  <td style="white-space:nowrap">${fmtTSd(b.createdAt)}</td><td style="white-space:nowrap">${nextVisitCell(b)}</td><td>${pill(b.status)}</td><td>${b.status==='Approved'||b.access?pill(accessLabel(b)):'<span class="muted">—</span>'}</td>
  <td>${b.status==='Pending'?`<div class="btns" style="flex-wrap:nowrap"><button class="btn sm" data-action="approve" data-id="${b.id}">${ic('check',14)} Approve</button><button class="btn sm danger" data-action="reject" data-id="${b.id}">Reject</button></div>`:''}</td></tr>`}).join('')||'<tr><td colspan="12" class="empty">No bloggers match these filters</td></tr>'}
  </tbody></table></div></div><div class="muted small" style="margin-top:8px">${list.length} shown</div>`;
}
function pgBloggers(){
  const counts=s=>DB.bloggers.filter(b=>b.status===s).length;
  return `<div class="toolbar">
  <div class="search">${ic('search',15)}<input class="inp" placeholder="Search name, username, phone, handle…" data-filter="bq" value="${esc(S.bq)}"></div>
  <select class="inp" data-select="bstatus">${['All','Pending','Approved','Rejected','Suspended'].map(s=>`<option ${S.bstatus===s?'selected':''} value="${s}">${s==='All'?'All statuses':`${s} (${counts(s)})`}</option>`).join('')}<option value="Flagged" ${S.bstatus==='Flagged'?'selected':''}>🚩 Red flag (${DB.bloggers.filter(b=>b.flag).length})</option></select>
  <select class="inp" data-select="baccess"><option value="All" ${S.baccess==='All'?'selected':''}>All access</option><option value="Active" ${S.baccess==='Active'?'selected':''}>Can sign in (${DB.bloggers.filter(hasAccess).length})</option></select>
  ${DB.groups.length?`<select class="inp" data-select="bgroup"><option value="All">All groups</option>${DB.groups.map(g=>`<option value="${g.id}" ${S.bgroup===g.id?'selected':''}>${esc(g.name)}</option>`).join('')}</select>`:''}
  </div><div id="tbl">${bloggersTable()}</div>`;
}
function pgBlogger(b){
  const socials=socialsOf(b.id);
  const res=resOf(b.id).sort((x,y)=>rInfo(y).date.localeCompare(rInfo(x).date));
  const att=res.filter(r=>r.attendance==='Attended').length,ns=res.filter(r=>r.attendance==='No-show').length,canc=res.filter(r=>r.status==='Cancelled').length;
  const marked=att+ns;
  const kk=r=>{const i=rInfo(r);return i.date+i.start};
  const up=res.filter(r=>r.status==='Confirmed'&&!resPast(r)).sort((x,y)=>kk(x).localeCompare(kk(y)));
  const hist=res.filter(r=>!up.includes(r));
  const waiting=DB.invitations.filter(i=>i.bloggerId===b.id).map(i=>cp(i.campaignId)).filter(c=>c&&cStatus(c)==='Active'&&(isOpen(c)||!res.some(r=>r.campaignId===c.id&&r.status!=='Cancelled')));
  const dayChip=d=>{const n=Math.round((parseD(d)-parseD(iso(new Date())))/864e5);return n<=0?'Today':n===1?'Tomorrow':`In ${n} days`};
  const grps=groupsOf(b.id);
  const msgs=DB.notifications.filter(n=>n.bloggerId===b.id).slice(0,8);
  let acts=[];
  if(b.status==='Pending')acts.push(`<button class="btn pri" data-action="approve" data-id="${b.id}">${ic('check',15)} Approve</button><button class="btn danger" data-action="reject" data-id="${b.id}">Reject</button>`);
  if(b.status==='Approved'){
    if(!hasAccess(b))acts.push(`<button class="btn pri" data-action="issueAccess" data-id="${b.id}">${ic('link',15)} Activate account</button>`);
    acts.push(`<button class="btn" data-action="suspend" data-id="${b.id}">Suspend</button>`);
  }
  if(b.status==='Rejected')acts.push(`<button class="btn" data-action="approve" data-id="${b.id}">Approve instead</button>`);
  if(b.status==='Suspended')acts.push(`<button class="btn pri" data-action="reactivate" data-id="${b.id}">Reactivate</button>`);
  if(hasAccess(b))acts.push(`<button class="btn" data-action="inviteBlogger" data-id="${b.id}">✉️ Invite to a campaign</button>`);
  acts.push(`<button class="btn" data-action="editBlogger" data-id="${b.id}">${ic('edit',15)} Edit</button>`);
  return `<div class="card card-b" style="margin-bottom:16px"><div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap">
    <div class="avatar lg">${initials(b.name)}</div>
    <div style="flex:1;min-width:200px"><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><h2 style="font-size:18px">${esc(b.name)}</h2>${pill(b.status)}${b.flag?'<span class="pill p-red">🚩 Red flag</span>':ns?`<span class="pill p-red">⚠ ${ns} no-show${ns>1?'s':''}</span>`:''}${b.lang==='ar'?'<span class="chip">عربي</span>':''}</div>
    <div class="muted" style="margin-top:3px"><span class="mono">${esc(b.username)}</span> · Account <span class="mono">${b.accountId}</span> · Registered ${fmtTSd(b.createdAt)}</div></div>
    <div class="btns">${acts.join('')}</div></div></div>
  ${b.flag?`<div class="card flagcard"><div class="card-h"><h3>🚩 Red flag</h3><span class="muted small">Added ${fmtTSd(b.flag.at)}${b.flag.ref?` · no-show on ${esc(b.flag.ref)}`:''}</span></div><div class="card-b">
    <p style="margin:0 0 10px">Check what happened before inviting ${esc(first(b.name))} again. No message has been sent automatically.</p>

function allGroupsView(){
  const q=(S.gq||'').trim().toLowerCase();
  const appr=DB.bloggers.filter(b=>b.status==='Approved');
  const list=appr.filter(b=>{
    const gs=groupsOf(b.id);
    if(S.gfilter==='none'&&gs.length)return false;
    if(q&&!(b.name+' '+(igOf(b)?.username||'')+' '+b.username).toLowerCase().includes(q))return false;
    return true}).sort((a,b)=>a.name.localeCompare(b.name));
  const none=appr.filter(b=>!groupsOf(b.id).length).length;
  return `<div class="card"><div class="card-h"><div><h3>All bloggers</h3><div class="muted small">Every approved blogger and the groups they belong to. Add or remove groups directly from here.</div></div></div>
  <div class="card-b" style="padding-bottom:0"><div class="toolbar">
   <div class="search">${ic('search',15)}<input class="inp" placeholder="Search name or handle…" data-filter="gq" value="${esc(S.gq||'')}"></div>
   <select class="inp" data-select="gfilter"><option value="all" ${S.gfilter!=='none'?'selected':''}>All approved (${appr.length})</option><option value="none" ${S.gfilter==='none'?'selected':''}>Not in any group (${none})</option></select>
  </div></div>
  <div id="tbl">${allGroupsTable(list)}</div></div>`;
}
function allGroupsTable(list){
  if(!list){const q=(S.gq||'').trim().toLowerCase();list=DB.bloggers.filter(b=>b.status==='Approved'&&!(S.gfilter==='none'&&groupsOf(b.id).length)&&(!q||(b.name+' '+(igOf(b)?.username||'')+' '+b.username).toLowerCase().includes(q))).sort((a,b)=>a.name.localeCompare(b.name))}

  ${list.map(b=>{const gs=groupsOf(b.id);const avail=DB.groups.filter(g=>!gs.includes(g));return `<tr><td><button class="btn ghost sm" style="padding:2px 0;text-align:left" data-action="openBlogger" data-id="${b.id}"><div class="who"><div class="avatar">${initials(b.name)}</div><div><div class="n">${esc(b.name)}</div><div class="muted small" style="font-weight:400">@${esc(igOf(b)?.username)}</div></div></div></button></td>
  <td class="mono">${esc(b.username)}</td>
  <td>${gs.map(g=>`<span class="chip">${esc(g.name)}<button data-action="removeFromGroup" data-g="${g.id}" data-id="${b.id}" title="Remove from ${esc(g.name)}">${ic('x',12)}</button></span>`).join('')||'<span class="pill p-amber">No group</span>'}</td>
  <td>${pill(accessLabel(b))}</td>
  <td>${avail.length?`<select class="inp" data-addgrp="${b.id}" style="width:100%"><option value="">+ Add to group…</option>${avail.map(g=>`<option value="${g.id}">${esc(g.name)}</option>`).join('')}</select>`:'<span class="muted small">In every group</span>'}</td></tr>`}).join('')||'<tr><td colspan="5" class="empty">No bloggers match</td></tr>'}
  </tbody></table></div>`;
}

/* ----- Blogger journey (storyboard of the real portal screens) ----- */
function jCamps(){return DB.campaigns.filter(c=>(S.jtype==='open')===isOpen(c)).sort((a,b)=>({Active:0,Paused:1,Draft:2,Closed:3,Completed:4,Cancelled:5})[cStatus(a)]-({Active:0,Paused:1,Draft:2,Closed:3,Completed:4,Cancelled:5})[cStatus(b)])}
function jBlogger(c){const ok=DB.bloggers.filter(x=>x.status==='Approved'&&hasAccess(x));return ok.find(x=>!DB.reservations.some(r=>r.campaignId===c.id&&r.bloggerId===x.id&&r.status!=='Cancelled'))||ok[0]}
function jStrip(h){return h.replace(/ data-action="[^"]*"/g,'')}
function jCapture(fn){const o=openModal;let g=null;openModal=x=>{g=x};try{fn()}finally{openModal=o}return g}
function jNav(tab){return `<nav class="bnav">${[['inv','Invitations','🎟️'],['book','My bookings','📅'],['acc','Account','🙂']].map(([k,l,i])=>`<button class="${tab===k?'on':''}"><span class="bem">${i}</span>${l}</button>`).join('')}</nav>`}
function jFrame(n,title,desc,inner,sheet){
  return `<div class="jstep"><div class="jlab"><span class="jn">${n}</span><div><div class="b">${title}</div><div class="muted small">${desc}</div></div></div>
  <div class="pf"><div class="pf-scroll">${jStrip(inner)}</div>${sheet?`<div class="pf-dim"></div><div class="pf-sheet"><div class="pf-grab"></div><div class="b" style="font-size:15px;margin-bottom:10px">${sheet.title}</div>${jStrip(sheet.body)}</div>`:''}</div></div>`;
}
function pgJourney(){
  if(!S.jtype)S.jtype='single';
  let list=jCamps();
  if(!list.length){S.jtype=S.jtype==='open'?'single':'open';list=jCamps()}
  let c=cp(S.jcamp);if(!c||isOpen(c)!==(S.jtype==='open')||!list.includes(c)){c=list[0];S.jcamp=c?c.id:null}
  const tabs=`<div class="jtabs"><button class="${S.jtype==='single'?'on':''}" data-action="jType" data-t="single"><span>📍</span><div><b>One restaurant</b><small>One restaurant, set dates and time slots, limited tables</small></div></button><button class="${S.jtype==='open'?'on':''}" data-action="jType" data-t="open"><span>🗓️</span><div><b>Open invitation</b><small>Blogger picks restaurant, date and time slot</small></div></button></div>`;
  if(!c)return tabs+'<div class="card empty">No campaigns of this type yet. Create one to preview it.</div>';
  const b=jBlogger(c);if(!b)return tabs+'<div class="card empty">Approve a blogger and issue a link to preview the journey.</div>';
  const open=isOpen(c);
  const oldP=S.portal;S.portal=Object.assign({},oldP,{bloggerId:b.id});
  const day=addDays(1);const dmin=open?(day>c.startDate?day:c.startDate):c.date;
  const sl=open?slotsOf(c)[0]:null;
  const tmp={id:'res_journey_tmp',ref:'RSV-7K3M9Q',campaignId:c.id,bloggerId:b.id,status:'Confirmed',attendance:'Not marked',bookedAt:Date.now(),cancelledAt:null,cancelledBy:null,notes:'',...(open?{restaurantId:c.restaurantIds[0],date:dmin,time:sl.start,slotEnd:sl.end}:{restaurantId:c.restaurantId,date:slotsOf(c)[0].date,time:slotsOf(c)[0].start,slotEnd:slotsOf(c)[0].end})};
  let steps=[];
  try{
    const first1=esc(first(b.name));
    const wa=`<div class="p-pad" style="background:#e9e1d6;min-height:100%;padding-top:30px"><div class="wa" style="margin-top:0"><div class="wa-h"><img src="${MNH_MARK}" alt="">MNH Al-Hajery</div><div class="wa-b">${esc(renderMsg(c,b)).replace(/\n/g,'<br>').replace(/(https:\/\/\S+)/,'<u>$1</u>')}<div class="wa-t">10:24</div></div></div><p class="small" style="color:#6f675d;margin-top:14px">This is the message the blogger receives on WhatsApp. The link is personal to them.</p></div>`;
    const ver=`<div class="p-pad" style="padding-top:34px"><div class="success-ic" style="margin:8px 0 0;background:#f1ebe2;color:#1f2328">${ic('shield',28)}</div><div class="p-hello" style="margin-top:16px">Verify it's you</div><div class="p-sub">Enter the phone number you registered with. We'll send a one-time code to it.</div><div style="display:flex;gap:8px;margin-top:22px"><input class="pinp" value="${esc(b.cc)}" style="width:90px" readonly><input class="pinp" value="${esc(b.phone)}" readonly></div><button class="pbtn">Send code</button><p class="small" style="color:#776f65;margin-top:16px">🔒 If someone else opens this link, they are stopped here because their number will not match.</p></div>`;
    const otp=`<div class="p-pad" style="padding-top:34px"><div class="p-hello" style="margin-top:8px">Enter your code</div><div class="p-sub">We sent a 6-digit code to ${esc(b.cc)} •••• ${esc(b.phone.slice(-2))}.</div><input class="pinp otp" value="4 8 2 1 9 6" readonly style="margin-top:22px"><button class="pbtn">Verify &amp; continue</button><p class="small" style="color:#776f65;margin-top:16px">In the live version the code arrives by SMS or WhatsApp. In this demo it shows on screen.</p></div>`;
    const hi=`<div class="p-pad" style="padding-bottom:4px"><img class="brand-logo" src="${MNH_MARK}" alt="" style="width:28px;margin-bottom:14px"><div class="p-hello">Hi ${first1} 👋</div><div class="p-sub">You have 1 invitation.</div></div>`;
    const card=open?openCard(c,b):invCard(c,b);
    const home=hi+card+jNav('inv');
    const chooser=open?openChooser(c,b)+jNav('inv'):'';
    DB.reservations.push(tmp);
    const bkRow=(()=>{const i=rInfo(tmp),rest=i.rest;return `<div class="bk"><img src="${restThumb(rest)}" alt=""><div style="flex:1;min-width:0"><div class="t">${esc(rest.name)}</div><div class="s">${fmtD(i.date)} · ${i.end?`${fmtT(i.start)} – ${fmtT(i.end)}`:fmtT(i.start)}</div><div style="margin-top:5px;display:flex;gap:6px;align-items:center;flex-wrap:wrap">${pill('Confirmed')}<span class="ref">${tmp.ref}</span></div></div><button class="btn sm">View</button></div>`})();
    const mine=`<div class="p-pad" style="padding-bottom:0"><div class="p-hello">My bookings 📅</div></div><div class="p-sec">📅 Upcoming</div>${bkRow}<div class="p-sec">✅ Previous visits</div><div class="p-empty">No previous visits yet.</div>${jNav('book')}`;
    if(!open){
      const s1=jCapture(()=>pReserveSheet(c.id)),s2=jCapture(()=>pResSheet(tmp.id,true));
      steps=[['1','Gets the WhatsApp message','Personal link, sent by the marketing team',wa],['2','Opens the link and verifies','Phone number must match the registered one',ver],['3','Enters the code','One-time code, 5 attempts',otp],['4','Sees the invitation','Restaurant, date, time, what is included, tables left',home],['5','Taps Reserve','Confirms the details. The last table can only be booked once',home,s1],['6','Booking confirmed','Reference number and the cancellation rule',home,s2],['7','Finds it under My bookings','Can cancel until '+c.cancelHours+' hours before',mine]];
    }else{
      const s1=jCapture(()=>pOpenSheet(c.id,c.restaurantIds[0])),s2=jCapture(()=>pResSheet(tmp.id,true));
      steps=[['1','Gets the WhatsApp message','Personal link, sent by the marketing team',wa],['2','Opens the link and verifies','Phone number must match the registered one',ver],['3','Enters the code','One-time code, 5 attempts',otp],['4','Sees the open invitation','All restaurants, period, visits used this month',home],['5','Chooses a restaurant','Only active restaurants in this campaign',chooser],['6','Picks a date and time slot','Tables left per slot, fully booked slots are greyed out',chooser,s1],['7','Booking confirmed','Reference number and the cancellation rule',chooser,s2],['8','Finds it under My bookings','Can cancel until '+c.cancelHours+' hours before',mine]];
    }
  }finally{DB.reservations=DB.reservations.filter(r=>r.id!==tmp.id);S.portal=oldP}
  const rules=open?[`Up to <b>${c.perMonth}</b> visits per blogger each calendar month`,`Dates between <b>${fmtD(c.startDate)}</b> and <b>${fmtD(c.endDate)}</b>, from tomorrow`,`<b>${slotsOf(c).length}</b> time slots: ${slotsOf(c).map(slotLabel).join(', ')}`,`Tables per restaurant: ${slotsOf(c).map(x=>`${slotLabel(x)} <b>${x.cap||'no limit'}</b>`).join(' · ')}`,`Same restaurant cannot be booked twice on the same day`]
    :[`<b>${c.capacity}</b> tables in total across <b>${slotsOf(c).length}</b> time slot${slotsOf(c).length>1?'s':''}, one booking per blogger`,`When the last table goes, everyone else sees <b>FULLY BOOKED</b>`,`If the campaign is paused or closed, the button is disabled`,`Cancelling gives the table back instantly`];
  const more=[`Cancel allowed until <b>${c.cancelHours} hours</b> before the visit`,...(offerLines(c).length?[`Included: ${offerExtras(c).map(esc).join(' · ')||'nothing specified'}`]:['No extras specified (guests, budget or set menu)'])];
  return `${tabs}

/* ----- Reservations ----- */
function filteredRes(){
  const q=S.rq.trim().toLowerCase();
  return DB.reservations.filter(r=>{
    const i=rInfo(r),c=i.c,b=bl(r.bloggerId),rest=i.rest;
    if(S.rstatus!=='All'&&r.status!==S.rstatus)return false;
    if(S.rrest!=='All'&&rest.id!==S.rrest)return false;
    if(S.ratt!=='All'&&r.attendance!==S.ratt)return false;
    if(S.rscope==='Upcoming'&&resPast(r))return false;
    if(S.rscope==='Past'&&!resPast(r))return false;
    if(S.rscope==='Today'&&i.date!==iso(new Date()))return false;
    if(S.rscope==='Tomorrow'&&i.date!==addDays(1))return false;
    if(S.rscope==='This week'&&(i.date<iso(new Date())||i.date>addDays(6)))return false;
    if(!q)return true;
    return [b.name,igOf(b)?.username,i.where,c.name,r.ref].join(' ').toLowerCase().includes(q);
  }).sort((a,b)=>(rInfo(b).date+rInfo(b).start).localeCompare(rInfo(a).date+rInfo(a).start)||b.bookedAt-a.bookedAt);
}
const GROUPED=()=>['Today','Tomorrow','This week'].includes(S.rscope);
const grpKey=r=>{const i=rInfo(r);return i.date+'|'+i.rest.id+'|'+i.br.id+'|'+i.slotStart};
function grpHead(list,ix){if(!GROUPED())return '';const k=grpKey;const r=list[ix];if(ix&&k(list[ix-1])===k(r))return '';const g=list.filter(x=>k(x)===k(r));const n=g.length;const i=rInfo(r);const can=g.filter(x=>x.status==='Confirmed'&&resStarted(x)).length;
  return `<tr class="grp"><td colspan="10"><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><span>${esc(i.where)} · ${fmtDL(i.date)} · ${i.winEnd?`${fmtT(i.slotStart)} – ${fmtT(i.winEnd)}`:fmtT(i.slotStart)} · ${n} visit${n>1?'s':''}</span>${can?`<button class="btn sm" data-action="slotAttended" data-k="${esc(k(r))}">${ic('check',13)} Mark all ${can} attended</button>`:''}</div></td></tr>`}
function resTable(){

function monthRange(k){const d=new Date(TODAY.getFullYear(),TODAY.getMonth()+k,1);const e=new Date(d.getFullYear(),d.getMonth()+1,0);return [iso(d),iso(e),d.toLocaleDateString('en-GB',{month:'long'})]}

function readCampaignForm(){
  const v=id=>$('#'+id).value;
  const g=v('f_guests');const T=M.type;const ot=v('f_otype');const o={type:T,guests:g===''?'':+g,offerType:ot,budget:ot==='budget'?(parseFloat(v('f_budget'))||null):null,setMenu:'',name:v('f_name').trim(),restaurantId:T==='single'?v('f_rest'):null,date:T==='single'?null:v('f_sdate'),start:null,end:null,capacity:null,inviteLimit:null,cancelHours:Math.max(0,parseInt(v('f_hours'))||0),everyone:!!M.everyone,groupIds:[...M.groupIds],manualIds:[...M.manualIds],description:v('f_desc').trim(),instructions:v('f_ins').trim(),message:v('f_msg')};
  if(ot==='budget'&&!o.budget)return 'Add the table budget amount, or choose "Nothing specified".';
  o.pick=(document.querySelector('input[name=f_pick]:checked')||{}).value==='time'?'time':'slot';o.step=+v('f_step')||30;o.late=o.pick==='time'&&v('f_late')?+v('f_late'):'';
  o.messageAr=$('#f_msgar')?$('#f_msgar').value:'';if(o.messageAr===(DB.settings.templateAr||MSG_DEF.invite.ar))o.messageAr='';
  if(T==='single'){const rr=rs(v('f_rest'));o.branchId=$('#f_br')?$('#f_br').value:brOf(rr).id}
  if(T==='open'){
    syncSlots();const sl=M.slots.filter(x=>x.start&&x.end).map(x=>({...x})).sort((a,b)=>a.start.localeCompare(b.start));
    if(!sl.length)return 'Add at least one time slot.';
    if(sl.some(x=>x.end<=x.start))return 'Each time slot must end after it starts.';
    for(let k=1;k<sl.length;k++)if(sl[k].start<sl[k-1].end)return 'Time slots overlap. Please adjust them.';
    Object.assign(o,{slots:sl,start:sl[0].start,end:sl[sl.length-1].end,restaurantIds:[...M.rids],startDate:v('f_sdate'),endDate:v('f_edate'),perMonth:parseInt(v('f_permonth'))||0,dailyCap:null});
    if(!o.restaurantIds.length)return 'Choose at least one restaurant.';
    if(!o.startDate||!o.endDate||o.endDate<o.startDate)return 'Check the available from / until dates.';
    if(!M.launched&&o.endDate<iso(new Date()))return 'The "available until" date is in the past.';
    if(o.perMonth<1)return 'Visits per month must be at least 1.';
  }else{
    if(!o.restaurantId)return 'Choose a restaurant.';
    syncSlots();const sl=M.slots.filter(x=>x.date&&x.start&&x.end).map(x=>({date:x.date,start:x.start,end:x.end,cap:+x.cap||0})).sort((a,b)=>(a.date+a.start).localeCompare(b.date+b.start));
    if(!sl.length)return 'Add at least one visit date and time.';
    if(sl.some(x=>x.end<=x.start))return 'Each time slot must end after it starts.';
    if(sl.some(x=>x.cap<1))return 'Choose the number of tables for every time slot.';
    {const bad=sl.find(x=>blockedOn(o.restaurantId,x.date));if(bad){const bk=blockedOn(o.restaurantId,bad.date);return `${rs(o.restaurantId).name} is closed on ${fmtD(bad.date)}${bk.reason?' ('+bk.reason+')':''}. Pick another date or unblock it in Restaurants.`}}
    if(!M.launched&&sl.some(x=>at(x.date,x.start)<=new Date()))return 'One of the time slots is in the past. Please change its date or time.';
    for(let k=1;k<sl.length;k++)if(sl[k].date===sl[k-1].date&&sl[k].start<sl[k-1].end)return 'Two time slots on the same day overlap. Please adjust them.';

  }

  if(!o.everyone&&!o.groupIds.length&&!o.manualIds.length)return 'Choose who to invite: all approved bloggers, or pick individual bloggers.';
  return o;
}
