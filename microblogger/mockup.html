async function stressTest(cid){
  const c=cp(cid);const sIdx=Math.max(0,slotsOf(c).findIndex(x=>slotLeft(c,x)>0&&at(x.date,x.start)>new Date()));const rem=slotLeft(c,slotsOf(c)[sIdx]);
  const pool=invitesOf(cid).map(i=>bl(i.bloggerId)).filter(b=>hasAccess(b)&&!DB.reservations.some(r=>r.campaignId===cid&&r.bloggerId===b.id&&r.status!=='Cancelled'));
  const n=Math.min(pool.length,rem+1);
  if(n<2){toast('Not enough invited bloggers without a booking to run this test.');return}
  const contenders=pool.slice(0,n);
  const results=await Promise.all(contenders.map(b=>new Promise(res=>setTimeout(()=>res({b,r:reserveSpot(cid,b.id,{slotIdx:sIdx})}),Math.random()*40))));
  render();
  const ok=results.filter(x=>x.r.ok).length;
  openModal({title:'Overbooking test result',body:`<p style="margin-top:0">${n} booking requests arrived at the same moment for <b>${rem}</b> remaining table${rem>1?'s':''}. <b>${ok}</b> succeeded, <b>${n-ok}</b> ${n-ok===1?'was':'were'} refused. Tables left now: <b>${remaining(c)}</b>.</p>
  <div class="checklist" style="max-height:300px">${results.map(x=>`<label style="cursor:default"><span style="flex:1">${esc(x.b.name)}</span>${x.r.ok?pill('Confirmed'):`<span class="pill p-red">Refused: fully booked</span>`}</label>`).join('')}</div>
  <p class="muted small">The successful test bookings are real in this demo. Cancel them from Reservations to free the tables again.</p>`,foot:`<button class="btn pri" data-action="closeModal">Done</button>`});
}

function portalBlogger(){return S.portal.bloggerId?bl(S.portal.bloggerId):null}
function demoBlogger(cc,ph){
  /* presentation mode: find the blogger by phone, else the newest one, else create a guest, and make sure the account is active */
  let b=ph&&DB.bloggers.find(x=>x.cc===cc&&x.phone===ph);
  if(!b)b=[...DB.bloggers].sort((x,y)=>y.createdAt-x.createdAt)[0];
  if(!b){const nm='Guest Blogger';b={id:uid('blg'),accountId:genAccountId(),username:genUsername(nm),name:nm,nationality:'Kuwait',cc,phone:ph||'50000000',lang:LANG,status:'Pending',createdAt:Date.now(),notes:'',access:null,lastLogin:null};DB.bloggers.push(b);DB.socials.push({id:uid('soc'),bloggerId:b.id,platform:'Instagram',username:'guest.blogger',url:'https://instagram.com/guest.blogger',primary:true})}
  if(!hasAccess(b)){const TT=toast;toast=()=>{};try{A.approve({id:b.id,quiet:1})}finally{toast=TT}}
  return b;
}
function authBlogger(){
  const P=S.portal;const cc=($('#pv_cc')?.value||'+965').trim(),ph=($('#pv_phone')?.value||'').replace(/\D/g,'');P.phoneDraft=ph;
  P.errKind='';
  if(lenient()){const b=demoBlogger(cc,ph);P.bloggerId=b.id;P.token=b.access.token;return b}
  if(P.general){const b=DB.bloggers.find(x=>x.cc===cc&&x.phone===ph);
    if(!b){P.err=T("We couldn't find an account for this number. Check the number, or apply to join.");P.errKind='none';render();return null}
    if(!hasAccess(b)){
      if(b.status==='Pending'){P.err=T("Your application is still under review. We'll message you on WhatsApp as soon as it's approved.");P.errKind='info'}
      else if(b.status==='Rejected'){P.err=T("Your application wasn't approved. Please contact the marketing team if you think this is a mistake.")}
      else if(b.status==='Suspended'){P.err=T('This account is suspended. Please contact the marketing team.')}
      else{P.err=T("Your account isn't active yet. Please contact the marketing team.")}
      render();return null}
    P.bloggerId=b.id;P.token=b.access.token;return b}
  const b=portalBlogger();
  if((FRESH||ph!=='')&&(cc!==b.cc||ph!==b.phone)){P.err=T("This number doesn't match this account.");render();return null}
  return b;
}

/* ============================================================

function render(){
  runReminders();
  LANG=S.view==='admin'?'en':(S.lang||'en');
  renderBar();
  if(S.view==='admin')renderAdmin();else if(S.view==='register')renderRegister();else renderPortal();
}
function render2(){if(S.view==='portal'){const sc=window.scrollY;render();window.scrollTo(0,sc)}}
function go(v){S.view=v;try{history.replaceState(null,'','#'+v)}catch(e){location.hash=v}closeModal();render();window.scrollTo(0,0)}

const A={
 view:d=>go(d.v),
 nav:d=>{S.page=d.p;render();window.scrollTo(0,0)},
 toggleSide:()=>{S.side=!S.side;render()},
 overlay:(d,el,e)=>{if(e.target===el)closeModal()},
 closeModal,
 confirmOk:()=>{const f=CONFIRM_FN;const why=($('#cx_reason')?.value||'').trim();CONFIRM_FN=null;closeModal();f&&f(why)},
 openBlogger:d=>{S.view='admin';S.page='blogger';S.bloggerId=d.id;render();window.scrollTo(0,0)},
 openCampaign:d=>{S.page='campaign';S.campaignId=d.id;S.ctab='inv';render();window.scrollTo(0,0)},
 approve:d=>{const b=bl(d.id);b.status='Approved';b.rejectReason='';if(!hasAccess(b))b.access={token:mkToken(),issuedAt:Date.now(),revoked:false,revokedAt:null};notify(b.id,'Application approved',tpl('approved',b));const n=inviteRunning(b);
   save();if(!d.quiet)render();toast(`${b.name} approved. They can sign in now.${n?` Invited to ${n} running campaign${n>1?'s':''}.`:''}`);return n},

 suspend:d=>{const b=bl(d.id);confirmBox('Suspend account?',`${esc(b.name)} will not be able to log in or book. They can't sign in until reactivated. Existing reservations are kept.`,'Suspend',()=>{b.status='Suspended';if(b.access&&!b.access.revoked){b.access.revoked=true;b.access.revokedAt=Date.now()}DB.memberships=DB.memberships.filter(m=>m.bloggerId!==b.id);save();render();toast('Account suspended')})},
 reactivate:d=>{const b=bl(d.id);b.status='Approved';b.access={token:mkToken(),issuedAt:Date.now(),revoked:false,revokedAt:null};notify(b.id,'Account activated',tpl('activated',b));save();render();toast(`${b.name} reactivated. They can sign in again.`)},
 issueAccess:d=>{const b=bl(d.id);b.access={token:mkToken(),issuedAt:Date.now(),revoked:false,revokedAt:null};notify(b.id,'Account activated',tpl('activated',b));const n=inviteRunning(b);
   save();render();toast(`Account activated. Access message queued, not sent.${n?` Invited to ${n} running campaign${n>1?'s':''}.`:''}`)},
 revoke:d=>{const b=bl(d.id);confirmBox('Revoke access?',`${esc(b.name)}'s personal link will stop working immediately. You can issue a new link later.`,'Revoke',()=>{b.access.revoked=true;b.access.revokedAt=Date.now();save();render();toast('Access revoked')})},

 editBlogger:d=>bloggerForm(d.id),

 rmSocialRow:d=>{syncSocialInputs();M.socials.splice(+d.i,1);$('#e_socials').innerHTML=socialRows()},
 saveBlogger:d=>{syncSocialInputs();const b=bl(d.id);const name=$('#e_name').value.trim(),cc=$('#e_cc').value.trim(),phone=$('#e_phone').value.replace(/\D/g,'');
   if(!name||phone.length<7)return toast('Name and a valid phone are required');
   if(DB.bloggers.some(x=>x.id!==b.id&&x.cc===cc&&x.phone===phone))return toast('Another account already uses this phone number');
   b.name=name;b.cc=cc;b.phone=phone;b.nationality=cleanCountry($('#e_nat').value);b.email=($('#e_email')?.value||'').trim();b.notes=$('#e_notes').value.trim();
   DB.socials=DB.socials.filter(s=>s.bloggerId!==b.id).concat(M.socials.filter(s=>s.primary||s.username||s.url).map(s=>({...s,bloggerId:b.id})));
   save();closeModal();render();toast('Blogger updated')},
 addToGroupSel:d=>{const g=$('#addGroupSel').value;if(!g)return;DB.memberships.push({groupId:g,bloggerId:d.id});save();render();toast('Added to group')},
 removeFromGroup:d=>{DB.memberships=DB.memberships.filter(m=>!(m.groupId===d.g&&m.bloggerId===d.id));save();render();toast('Removed from group')},
 selGroup:d=>{S.groupId=d.id;render()},
 newGroup:()=>groupNameForm(null),
 renameGroup:d=>groupNameForm(d.id),
 saveGroup:d=>{const name=$('#g_name').value.trim();if(!name)return toast('Give the group a name');
   if(DB.groups.some(g=>g.id!==d.id&&g.name.toLowerCase()===name.toLowerCase()))return toast('A group with this name already exists');
   if(d.id){const g=DB.groups.find(x=>x.id===d.id);g.name=name;g.description=$('#g_desc').value.trim()}else{const g={id:uid('grp'),name,description:$('#g_desc').value.trim(),createdAt:Date.now()};DB.groups.push(g);S.groupId=g.id}
   save();closeModal();render();toast(d.id?'Group renamed':'Group created')},
 deleteGroup:d=>{const g=DB.groups.find(x=>x.id===d.id);confirmBox('Delete group?',`"${esc(g.name)}" will be deleted. Bloggers stay in the database and in their other groups.`,'Delete',()=>{DB.groups=DB.groups.filter(x=>x.id!==g.id);DB.memberships=DB.memberships.filter(m=>m.groupId!==g.id);save();render();toast('Group deleted')})},
 addMembers:d=>addMembersForm(d.id),
 saveMembers:()=>{if(!M.sel.length)return toast('Select at least one blogger');const n=M.sel.length;M.sel.forEach(id=>DB.memberships.push({groupId:M.gid,bloggerId:id}));save();closeModal();render();toast(`${n} added to group`)},

 newCampaign:()=>campaignForm(null),
 newCampaignT:d=>campaignForm(null,d.t),

 jLive:d=>{const c=cp(d.c),b=jBlogger(c);S.portal={step:'phone',bloggerId:b.id,token:b.access.token};go('portal')},
 statGo:d=>{const k=d.k;Object.assign(S,{bq:'',bstatus:'All',baccess:'All',bgroup:'All',rq:'',rstatus:'All',rrest:'All',ratt:'All',rscope:'All',cfilter:'All'});
   if(['all','pending','approved','active'].includes(k)){S.page='bloggers';if(k==='pending')S.bstatus='Pending';if(k==='approved')S.bstatus='Approved';if(k==='active'){S.bstatus='Approved';S.baccess='Active'}}
   else if(k==='camps'){S.page='campaigns';S.cfilter='Active'}
   else{S.page='reservations';S.rstatus='Confirmed';if(k==='upc')S.rscope='Upcoming'}
   render();window.scrollTo(0,0)},
 reviewPending:()=>{S.bstatus='Pending';S.page='bloggers';render()},
 editCampaign:d=>campaignForm(d.id),
 inviteBlogger:d=>{const b=bl(d.id);const cs=DB.campaigns.filter(c=>cStatus(c)==='Active');
   openModal({title:`Invite ${esc(first(b.name))} to a campaign`,body:cs.length?cs.map(c=>{const has=DB.invitations.some(i=>i.campaignId===c.id&&i.bloggerId===b.id);return `<div class="list-item" style="padding:10px 0"><img class="thumb" src="${cThumb(c)}" alt=""><div style="flex:1;min-width:0"><div style="font-weight:600">${esc(c.name)}</div><div class="muted small">${cDateLabel(c)} · ${esc(cRestName(c))}</div></div>${has?'<span class="muted small">Already invited</span>':`<button class="btn sm pri" data-action="inviteBloggerTo" data-id="${b.id}" data-c="${c.id}">Invite</button>`}</div>`}).join(''):'<div class="empty">No active campaigns right now.</div>',foot:'<button class="btn" data-action="closeModal">Done</button>'})},
 inviteBloggerTo:d=>{const b=bl(d.id),c=cp(d.c);if(!c.everyone&&!(c.manualIds||[]).includes(b.id))c.manualIds=[...(c.manualIds||[]),b.id];inviteOne(c,b);save();A.inviteBlogger({id:b.id});toast(`${first(b.name)} invited to ${c.name}`)},
 duplicateCampaign:d=>{campaignForm(null,null,d.id);toast('Copy ready. Change the dates, then save.')},
 saveCampaign:d=>{const o=readCampaignForm();if(typeof o==='string')return toast(o);
   if(!d.id&&d.launch==='1'&&d.ok!=='1'){const n=audience(o).filter(hasAccess).length;const f=$('.modal-f');M.footBackup=f.innerHTML;f.innerHTML=`<span style="flex:1;font-weight:500">Send this invitation to <b>${n}</b> blogger${n===1?'':'s'} on WhatsApp now?</span><button class="btn" data-action="launchBack">Back</button><button class="btn pri" data-action="saveCampaign" data-launch="1" data-ok="1">Yes, send now</button>`;return}
   if(d.id){const c=cp(d.id);if(!isOpen(c)){const live=DB.reservations.filter(r=>r.campaignId===c.id&&r.status!=='Cancelled');const bad=live.find(r=>{const rd=r.date||c.date,rt=r.time||c.start;const sl=o.slots.find(x=>x.date===rd&&x.start===rt);return !sl||live.filter(y=>(y.date||c.date)===rd&&(y.time||c.start)===rt).length>sl.cap});if(bad)return toast('A time slot that already has bookings cannot be removed or given fewer tables than its bookings.')}
     const changed=!isOpen(c)&&JSON.stringify(slotsOf(c))!==JSON.stringify(o.slots);const offerChanged=offerLines(c).join('|')!==offerLines(o).join('|');Object.assign(c,o);
     if(offerChanged&&!changed)DB.reservations.filter(r=>r.campaignId===c.id&&r.status==='Confirmed').forEach(r=>{const b=bl(r.bloggerId);notify(b.id,'Campaign update',tpl('update',b,()=>Object.assign(resVars(r)(),{details:(()=>{const ol=offerLines(c,true);return ol.length?ol.join(', '):T('details updated')})()})))});
     if(changed)DB.reservations.filter(r=>r.campaignId===c.id&&r.status==='Confirmed').forEach(r=>{const b=bl(r.bloggerId);notify(b.id,'Campaign update',tpl('update',b,()=>Object.assign(resVars(r)(),{details:T('the schedule has changed. Please check your booking.')})))});
     save();closeModal();render();toast('Campaign updated');return}
   const c=Object.assign({id:uid('cmp'),status:'Draft',createdAt:Date.now(),launchedAt:null},o);DB.campaigns.push(c);
   closeModal();S.page='campaign';S.campaignId=c.id;S.ctab='inv';
   if(d.launch==='1'){c.status='Active';c.launchedAt=Date.now();const r=sendInvites(c);toast(`Campaign launched · ${r.created} invitations prepared${r.skipped?` · ${r.skipped} skipped (not activated yet)`:''}`)}else{save();toast('Saved as draft')}
   render()},
 launchBack:()=>{const f=$('.modal-f');if(f&&M.footBackup)f.innerHTML=M.footBackup},
 launch:d=>{const c=cp(d.id);const n=audience(c).filter(hasAccess).length;confirmBox('Launch this campaign?',`This sends the invitation to <b>${n}</b> blogger${n===1?'':'s'} on WhatsApp.`,'Send now',()=>A.doLaunch(d),false)},
 doLaunch:d=>{const c=cp(d.id);if(campEnded(c))return toast('The visit date has passed. Edit the date first.');c.status='Active';c.launchedAt=Date.now();const r=sendInvites(c);render();toast(`Launched · ${r.created} invitations prepared${r.skipped?` · ${r.skipped} skipped (not activated yet)`:''}`)},
 sendMore:d=>{const c=cp(d.id);const r=sendInvites(c);render();toast(`${r.created} new invitations prepared`)},
 setCStatus:d=>{const c=cp(d.id);c.status=d.s;
   save();render();toast({Paused:'Campaign paused. No new bookings allowed.',Closed:'Campaign closed. No new bookings allowed.',Active:'Campaign open for bookings.'}[d.s])},

   confirmBox(c.status==='Draft'?'Discard draft?':'Cancel campaign?',c.status==='Draft'?'This draft will be cancelled.':`This cancels the campaign${n?` and its <b>${n}</b> confirmed reservation${n>1?'s':''}`:''}. Cancellation messages will be queued.`,c.status==='Draft'?'Discard':'Cancel campaign',()=>{
     DB.reservations.filter(r=>r.campaignId===c.id&&r.status==='Confirmed').forEach(r=>cancelReservation(r.id,'Admin'));c.status='Cancelled';save();render();toast('Campaign cancelled')})},

 doWarn:d=>{const r=DB.reservations.find(x=>x.id===d.id);const t=$('#warnTxt').value.trim();if(!t)return toast('The message is empty');notify(r.bloggerId,'No-show warning',t);r.warned=Date.now();save();closeModal();render();toast('Warning queued on WhatsApp')},

       const b=bl(r.bloggerId);if(!DB.invitations.some(i=>i.campaignId===to&&i.bloggerId===b.id))DB.invitations.push({id:uid('inv'),campaignId:to,bloggerId:b.id,token:b.access?.token||mkToken(),status:'Prepared',createdAt:Date.now(),message:'Added by admin'});
       const oldK=resKey(r),oldC=cp(r.campaignId);const rr=rs(c.restaurantId);

 pOpenConfirm:()=>{const sl=document.querySelector('input[name=o_slot]:checked');if(!sl){$('#o_info').innerHTML=`<span style="color:${ERR}">${T('Please choose a time slot.')}</span>`;return}
   const c=cp(M.oc);const tm=document.querySelector('input[name=p_time]:checked');if(isExact(c)&&!tm){$('#o_info').innerHTML=`<span style="color:${ERR}">${T('Please choose your arrival time.')}</span>`;return}

document.addEventListener('click',e=>{
  if(e.target.closest('td.nocl'))return;
  const el=e.target.closest('[data-action]');if(!el)return;
  const fn=A[el.dataset.action];if(!fn)return;
  if(el.dataset.action!=='overlay')e.preventDefault();
  fn(el.dataset,el,e);
});
document.addEventListener('submit',e=>{if(e.target.id==='regForm'){e.preventDefault();submitRegistration()}});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.filter){S[t.dataset.filter]=t.value;const box=$('#tbl');if(box)box.innerHTML=t.dataset.filter==='bq'?bloggersTable():t.dataset.filter==='gq'?allGroupsTable():resTable()}
  else if(t.hasAttribute('data-msearch')){M.mq=t.value;$('#mlist').innerHTML=manualList()}
  else if(t.hasAttribute('data-amsearch')){M.q=t.value;$('#amlist').innerHTML=amList()}
  else if(t.id==='f_limit')updateAudience();
  else if(t.dataset.bn!==undefined&&isMapsUrl(t.value)){const i=+t.dataset.bn;syncRestRows();M.branches[i].maps=t.value.trim();M.branches[i].name=nameFromMaps(t.value);$('#brbox').innerHTML=branchRows();const el=document.querySelector(`[data-bn="${i}"]`);el.focus();if(!M.branches[i].name)el.placeholder='Link saved. Now type the branch name';toast(M.branches[i].name?'Link saved and name filled in. Check the name.':'Link saved. Type the branch name.')}
  else if(t.dataset.calc){DB.settings.calc=DB.settings.calc||{bloggers:200,logins:8,cost:''};DB.settings.calc[t.dataset.calc]=t.value;save();const o=$('#calcOut');if(o)o.innerHTML=signinCalcOut()}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.select){S[t.dataset.select]=t.value;render()}
  else if(t.dataset.addgrp){if(t.value){DB.memberships.push({groupId:t.value,bloggerId:t.dataset.addgrp});save();render();toast('Added to group')}}
  else if(t.id==='f_otype'){$('#otypebox').dataset.ot=t.value}
  else if(t.id==='f_rest'){$('#f_brwrap').innerHTML=branchSel(t.value)}
  else if(t.name==='f_pick'){$('#f_exactbox').hidden=t.value!=='time'}
  else if(t.dataset.bsel){const id=t.dataset.bsel;S.bsel=t.checked?[...(S.bsel||[]),id]:(S.bsel||[]).filter(x=>x!==id);const box=$('#tbl');if(box)box.innerHTML=bloggersTable()}
  else if(t.dataset.bselall){S.bsel=t.checked?filteredBloggers().filter(b=>b.status==='Pending').map(b=>b.id):[];const box=$('#tbl');if(box)box.innerHTML=bloggersTable()}
  else if(t.name==='f_type'){syncSlots();M.type=t.value;$('#cform').dataset.type=t.value;M.slots.forEach(x=>{if(M.type==='single'){x.date=x.date||addDays(7);if(!x.cap)x.cap=5}});$('#slotbox').innerHTML=slotRows();updateSlotTotal()}
  else if(t.dataset.sc!==undefined||t.dataset.sd!==undefined){syncSlots();updateSlotTotal()}
  else if(t.dataset.rid){const id=t.dataset.rid;M.rids=t.checked?[...M.rids,id]:M.rids.filter(x=>x!==id)}
  else if(t.id==='f_everyone'){M.everyone=t.checked;const mf=$('#mfield');if(mf)mf.hidden=t.checked;updateAudience()}
  else if(t.dataset.gid){const id=t.dataset.gid;M.groupIds=t.checked?[...M.groupIds,id]:M.groupIds.filter(x=>x!==id);updateAudience()}
  else if(t.dataset.mid){const id=t.dataset.mid;M.manualIds=t.checked?[...M.manualIds,id]:M.manualIds.filter(x=>x!==id);updateAudience()}
  else if(t.dataset.am){const id=t.dataset.am;M.sel=t.checked?[...M.sel,id]:M.sel.filter(x=>x!==id)}
  else if(t.id==='o_date'||t.id==='o_br'){M.os='';openSheetBody()}
  else if(t.name==='o_slot'){M.ot='';openSheetBody()}
  else if(t.name==='s_slot'){M.st='';singleTimes()}
  else if(t.name==='p_time'){if(M.oc)M.ot=t.value;else M.st=t.value}
  else if(t.id==='r_file'&&t.files[0]){const f=t.files[0];if(f.size>2.5e6)return toast('Please use an image under 2.5 MB');const rd=new FileReader();rd.onload=()=>{M.image=rd.result;$('#r_prev').src=rd.result};rd.readAsDataURL(f)}
  else if(t.id==='r_c1'||t.id==='r_c2'){if(!M.image)$('#r_prev').src=restImg({name:$('#r_name').value||'Restaurant',colors:[$('#r_c1').value,$('#r_c2').value]})}
});
document.addEventListener('input',e=>{if(e.target.closest&&e.target.closest('#cform'))updateMsgPreview()});
document.addEventListener('change',e=>{if(e.target.closest&&e.target.closest('#cform'))setTimeout(updateMsgPreview,0)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#modal-root').innerHTML)closeModal();if(e.key==='Enter'&&e.target.id==='po_code')A.pVerify();if(e.key==='Enter'&&e.target.id==='pv_phone')A.pSendOtp();if(e.key==='Enter'&&e.target.id==='pl_link')A.pOpenLink()});
// live sync between tabs: open admin in one tab and the portal in another
window.addEventListener('storage',e=>{if(e.key===KEY&&e.newValue){try{DB=JSON.parse(e.newValue);migrate();if(!$('#modal-root').innerHTML)render()}catch(_){}}});

/* ---------- boot ---------- */
DB=load()||seed();migrate();DB.bloggers.forEach(b=>{if(b.nationality&&NAT_MAP[b.nationality])b.nationality=NAT_MAP[b.nationality]});save();
const h=(location.hash||'').slice(1);if(['admin','register','portal'].includes(h))S.view=h;
render();
</script>
</body>
</html>
